  - expr: 1000 * rate(node_disk_write_time_seconds_total{instance="node"}[2m]) / rate(node_disk_writes_completed_total{instance="node"}[2m])
    eval_time: 3m
    exp_samples:
    - labels: '{instance="node",device="eth0"}'
      value: 1
  - expr: (timestamp(node_disk_write_time_seconds_total{instance="node"}) + timestamp(node_disk_writes_completed_total{instance="node"})
      - abs(timestamp(node_disk_write_time_seconds_total{instance="node"}) - timestamp(node_disk_writes_completed_total{instance="node"})))
      / 2 and (timestamp(node_disk_write_time_seconds_total{instance="node"} offset
      2m) >= time() - 120 - 60) and (timestamp(node_disk_writes_completed_total{instance="node"}
      offset 2m) >= time() - 120 - 60)
    eval_time: 3m
    exp_samples:
    - labels: '{instance="node",device="eth0"}'
