android: {}
tasks:
- name: 模型生成记录
  # baseline.case_id: COM_KFB_MODEL_a341e0b47085
  # baseline.path: 创作 → 创作记录 → 搜索框及列表状态
  flow:
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航可见，其中有「创作」
    timeout: 12000
  - aiWaitFor: 页面中可见且可点击的目标：底部导航栏中间文字为「创作」的标签
    timeout: 12000
  - aiTap: 底部导航栏中间文字为「创作」的标签
  - aiWaitFor: 创作页展示「AI创作」和「创作记录」入口
    timeout: 12000
  - aiAssert: 创作页展示「AI创作」和「创作记录」入口
  - aiWaitFor: 创作页中可见「AI创作」及同一行右边的「创作记录」入口
    timeout: 12000
  - aiWaitFor: 页面中可见且可点击的目标：「AI创作」同一行最右侧的蓝色文字「创作记录」
    timeout: 12000
  - aiTap: 「AI创作」同一行最右侧的蓝色文字「创作记录」
  - aiWaitFor: 创作记录页的顶部标题为「创作记录」，标题下方显示「搜索创作标题」输入框
    timeout: 12000
  - aiAssert: 创作记录页的顶部标题为「创作记录」，标题下方显示「搜索创作标题」输入框
  - aiAssert: 创作记录页面的标题和搜索框可见，列表按年月分组，或显示「还没有创作记录」空提示，页面没有加载失败
