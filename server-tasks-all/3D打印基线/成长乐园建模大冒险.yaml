android: {}
tasks:
- name: 成长乐园建模大冒险
  # baseline.case_id: COM_KFB_MODEL_f303c4ecac57
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航的「成长」
  - aiWaitFor: 成长乐园有教材同步学、建模大冒险、科创乐园三个课程入口
    timeout: 12000
  - aiTap: 成长乐园「建模大冒险」卡片上的「进入课程」
  - sleep: 1500
  - ai: 检查屏幕正中是否有标题为「体验提示」的弹窗。如果有，点击弹窗内「我知道了」一次。如果没有弹窗，保持当前页面且不点击任何控件，结束本步。
  - aiWaitFor: 建模大冒险页面有「当前任务」以及「魔法涂鸦」和「魔法积木」学习入口
    timeout: 12000
  - aiAssert: 建模大冒险页面有「当前任务」以及「魔法涂鸦」和「魔法积木」学习入口
