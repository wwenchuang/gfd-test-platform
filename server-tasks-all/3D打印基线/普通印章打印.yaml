android:

tasks:
  - name: 普通印章打印
    # baseline.case_id: COM_KFB_MODEL_9d60338c7365
    # baseline.goal: 验证普通印章打印
    # baseline.start_page: App 首页
    # baseline.path: 趣味印章 -> 普通印章 -> 生成3D预览图 -> 去打印 -> 下一步 -> 返回
    # baseline.expected: 普通印章打印相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - aiWaitFor: "App 首页已加载完成，首页中部功能入口横向列表可见，包含 AI建模、模型导入或可继续横向滑动的入口"
        timeout: 60000
      - aiAction: "首页遗留切片任务清理：如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」进入「模型打印预览」；在预览页点击底部「取消打印」，弹出「确认要取消任务吗？」时点击「确定」，然后返回 App 首页。若首页没有该横幅/入口，则不要点击任何内容，直接继续。"
      - sleep: 1000
      - aiScroll: "首页中部建模功能横向 icon 列表区域，只在这个横向列表内滑动，不要滚动整个页面"
        scrollType: "singleAction"
        direction: "right"
        distance: 400
      - runAdbShell: "input swipe 950 1080 150 1080 500"
      - aiWaitFor: "首页中部功能入口横向列表中可见「趣味印章」入口"
        timeout: 30000
      - aiTap: "首页中部功能入口横向列表里的「趣味印章」卡片，不要点击底部导航中间的「AI建模」"
      - aiTap: "普通印章"
      - aiWaitFor: "普通印章编辑页已打开，能看到文字输入框"
        timeout: 60000
      - aiInput: "印章文字输入框"
        value: "UI自动化"
      - aiTap: "印章字体列表中间的字体选项"
      - aiTap: "生成3D预览图"
      - aiWaitFor: "3D 预览生成完成：页面出现可点击的「去打印」按钮，或已经进入模型打印编辑界面且底部出现「下一步」按钮"
        timeout: 240000
      - ai: "只判断当前截图，最多点击一次并立即结束本步骤：如果页面显示「去打印」按钮，则点击「去打印」后立即完成，不要继续观察或判断跳转后的页面；如果已经进入模型打印编辑界面且底部出现「下一步」按钮，则不要点击并立即完成"
      - aiWaitFor: "模型打印编辑流程已进入稳定状态：要么底部出现可点击的「下一步」按钮，要么右上角显示「未设置耗材」且需要先设置耗材，要么出现「请确认耗材颜色」弹窗"
        timeout: 240000
      - ai: "如果模型打印编辑页右上角显示「未设置耗材」且底部没有「下一步」按钮，则点击「未设置耗材」进入耗材选择，选择第一个可用耗材或默认耗材颜色，必要时点击「确认」「确定」「完成」或「保存」，回到模型打印编辑页并等待底部出现蓝色「下一步」按钮；如果底部已经有「下一步」按钮，或出现「请确认耗材颜色」弹窗，则不要操作"
      - ai: "如果当前页面弹出「请确认耗材颜色」弹窗，则点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗则不要操作"
      - aiWaitFor: "模型打印编辑界面已显示，底部出现可点击的「下一步」按钮"
        timeout: 240000
      - aiTap: "底部蓝色「下一步」按钮"
      - aiWaitFor: "页面已进入模型处理或打印预览流程：要么出现「请确认耗材颜色」弹窗，要么页面出现可点击的「取消打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "如果当前页面弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "确认耗材后页面已继续：要么页面出现可点击的「取消打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "确认耗材后只判断当前截图，最多再点击一次：如果仍在模型打印编辑页且底部显示蓝色「下一步」按钮，则再点击一次该「下一步」；如果已经出现「取消打印」按钮，或仍然存在「请确认耗材颜色」弹窗，则不要操作"
      - ai: "如果当前页面再次弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "下一步提交后页面已继续或可安全重试：要么页面出现可点击的「取消打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态，要么页面中央出现「网络连接超时」提示"
        timeout: 120000
      - ai: "如果当前仍在模型打印编辑页，或页面中央出现「网络连接超时」提示，并且底部显示蓝色「下一步」按钮，则再点击一次该「下一步」；如果已经出现「取消打印」按钮，或仍然存在「请确认耗材颜色」弹窗，则不要操作"
      - ai: "如果网络重试后再次弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "模型处理进度完成，页面出现可点击的「取消打印」按钮"
        timeout: 240000
      - ai: "取消清理只判断当前截图：如果出现「确认要取消任务吗」弹窗，点击「确定」；否则如果页面有「取消打印」或「取消处理」按钮，点击该取消按钮；如果页面已显示「已取消模型处理」、底部有「重新编辑」或「返回」按钮，则不要操作"
      - ai: "如果仍在模型打印预览页并看到「取消打印」，再次点击「取消打印」；如果出现确认取消、确定或确认弹窗，点击确认按钮；如果页面已显示「已取消模型处理」或已经离开模型打印预览页则不要操作"
      - aiWaitFor: "已离开模型打印预览确认页，或底部不再同时显示「取消打印」和「确认打印」按钮，或页面显示「已取消模型处理」"
        timeout: 60000
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
