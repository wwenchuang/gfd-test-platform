android: {}
tasks:
- name: 首页热门与最新模型
  # baseline.case_id: COM_KFB_MODEL_a19012262f73
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航最左侧的首页房子图标
  - aiWaitFor: 首页模型推荐区有「热门」和「最新」
    timeout: 12000
  - aiTap: 模型推荐区域的「热门」
  - aiWaitFor: 「热门」选中并加载了有标题的模型卡片
    timeout: 12000
  - aiTap: 同一分类栏的「最新」
  - aiWaitFor: 首页「最新」分类已选中，其下有带封面及标题的模型卡片，未显示网络错误
    timeout: 12000
  - aiAssert: 首页「最新」分类已选中，其下有带封面及标题的模型卡片，未显示网络错误
