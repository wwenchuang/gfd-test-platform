android: {}
tasks:
- name: 成长乐园科创项目
  # baseline.case_id: COM_KFB_MODEL_74ae8e3d4573
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航的「成长」
  - aiWaitFor: 成长乐园有教材同步学、建模大冒险、科创乐园三个课程入口
    timeout: 12000
  - aiTap: 成长乐园「科创乐园」卡片上的「进入课程」
  - aiWaitFor: 课程内容或带「我知道了」按钮的「体验提示」可见
    timeout: 20000
  - ai: 若出现「体验提示」且提示下载智小白HD，只点击「我知道了」一次；课程内容已经可见则结束。
  - aiWaitFor: 科创课页面出现创意桌面玩具主题、至少一个具名项目以及「立即学习」入口
    timeout: 12000
  - aiAssert: 科创课页面出现创意桌面玩具主题、至少一个具名项目以及「立即学习」入口
