android: {}
tasks:
- name: 个人导入文件保存期限
  # baseline.case_id: COM_KFB_MODEL_f9f07a41aa96
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航最右侧的「我的」
  - aiTap: 个人内容区「作品」右侧的「导入」标签
  - aiWaitFor: 「导入」标签已选中，出现「文件仅保存30天，过期自动删除」和文件卡片或明确的空列表提示
    timeout: 12000
  - aiAssert: 「导入」标签已选中，出现「文件仅保存30天，过期自动删除」和文件卡片或明确的空列表提示
