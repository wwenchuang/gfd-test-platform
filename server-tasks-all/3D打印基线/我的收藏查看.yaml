android:

tasks:
  - name: 我的收藏查看
    # baseline.case_id: COM_KFB_MODEL_a22bf0c3aab6
    # baseline.goal: 验证我的收藏查看
    # baseline.start_page: App 首页
    # baseline.path: 我的 -> 我的收藏 -> 系列模型 tab -> 模型 tab
    # baseline.expected: 我的收藏查看相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - aiWaitFor: "App 首页已加载完成，底部导航或「我的」入口可见"
        timeout: 60000
      - ai: "首页遗留任务入口只判断当前截图，最多点击一次：如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」；如果没有该横幅或入口，立即完成。不要滚动，不要进入其他页面。"
      - ai: "遗留任务取消只判断当前截图，最多点击一次：如果当前页面有「取消打印」或「取消处理」按钮，则点击该取消按钮；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果仍在首页或没有这些按钮，立即完成。不要滚动。"
      - ai: "遗留任务确认只判断当前截图，最多点击一次：如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果页面显示「已取消模型处理」、已经回到首页、或没有确认弹窗，立即完成。不要滚动。"
      - sleep: 1000
      - aiTap: "我的"
      - aiTap: "我的收藏"
      - aiWaitFor: "我的收藏页面已打开，能看到「系列模型」tab 或「模型」tab"
        timeout: 60000
      - aiTap: "系列模型 tab"
      - aiTap: "模型 tab"
      - aiAssert: "当前页面是我的收藏页面，且没有加载失败、网络错误或异常弹窗"
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
