android: {}

tasks:
  - name: "模型导入-微信导入"
    # baseline.case_id: COM_KFB_MODEL_0e27ae1d28a0
    # baseline.goal: 验证模型导入-微信导入
    # baseline.start_page: App 首页
    # baseline.path: 首页 → 导入打印 → 微信导入 → 文件传输助手 → 勾选指定 STL → 确定 → 确认导入 → 编辑 → 切片预览 → 返回
    # baseline.expected: 指定微信文件回传后加载为 10mm 立方体，完成切片并退出本次待确认预览。
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    # 运行前置：已安装并登录微信，测试账号的「文件传输助手」已预置唯一的 qa-import-cube-10mm.stl（deploy/3d-daily/fixtures/），可在微信文件选择器中勾选。
    flow:
      - runAdbShell: am force-stop com.kfb.model
      - launch: com.kfb.model
      - aiWaitFor: 底部导航可见「创作」和「我的」，最左侧可见房子图标
        timeout: 12000
      - aiTap: 底部导航最左侧的房子图标
      - aiWaitFor: 首页的 EP3-9888E0094F2A 设备卡片已刷新，明确显示「空闲」，或已显示打印中、任务待处理等占用状态
        timeout: 35000
      - aiAssert: 该设备栏显示空闲，首页没有正在打印、模型处理中或模型处理完成待打印的任务横幅。
      - aiTap: 首页快捷入口「导入打印」
      - aiWaitFor: 「模型导入」面板同时显示「本地导入」和「微信导入」
        timeout: 12000
      - aiTap: 模型导入面板内的「微信导入」
      - runAdbShell: |-
          # Open only the scoped app-to-WeChat confirmation dialogs.
          file=$(mktemp /data/local/tmp/qa-kfb-wechat.XXXXXX) || exit 1
          trap 'rm -f "$file"' EXIT
          tap_button() {
            bounds=$(tr '>' '\n' < "$file" | grep -F "package=\"$1\"" | grep -F "resource-id=\"$2\"" | grep -F "text=\"$3\"" | grep -F 'enabled="true"' | sed -n 's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p')
            set -- $bounds
            [ "$#" -eq 4 ] && [ "$3" -gt "$1" ] && [ "$4" -gt "$2" ] || return 1
            input tap "$((($1+$3)/2))" "$((($2+$4)/2))"
          }
          jumped=0; opened=0
          for attempt in 1 2 3 4 5 6 7 8; do
            : > "$file"
            uiautomator dump "$file" >/dev/null && [ -s "$file" ] || continue
            if grep -Fq 'text="“智小白3D”想要打开“微信”小程序"' "$file" && grep -Fq 'resource-id="com.oplus.securitypermission:id/alertTitle"' "$file"; then
              if [ "$opened" -eq 0 ]; then
                tap_button com.oplus.securitypermission android:id/button1 打开 || exit 1
                opened=1
              fi
            elif grep -Fq 'text="为保障您的使用体验，即将跳转至第三方小程序"' "$file" && grep -Fq 'resource-id="com.kfb.model:id/base_tipdialog_content"' "$file"; then
              if [ "$jumped" -eq 0 ]; then
                tap_button com.kfb.model com.kfb.model:id/view_icon_text_layout_text 立即跳转 || exit 1
                jumped=1
              fi
            elif grep -Fq 'package="com.tencent.mm"' "$file"; then
              exit 0
            fi
            sleep 1
          done
          echo 'WeChat import page did not open' >&2
          exit 1
      - aiWaitFor: 微信小程序的导入页底部可见「选择文件」，页面不含智小白 App 的「本地导入」选项或系统确认弹窗
        timeout: 30000
      - aiTap: 微信小程序导入页底部的「选择文件」按钮
      - aiWaitFor: 微信会话列表显示「文件传输助手」
        timeout: 12000
      - aiTap: 会话列表中的「文件传输助手」
      - aiWaitFor: 文件传输助手中完整文件名为「qa-import-cube-10mm.stl」的条目仅有一个，左侧有勾选框，底部有「确定」按钮
        timeout: 12000
      - aiTap: 完整文件名为「qa-import-cube-10mm.stl」的条目左侧的勾选框
      - aiAssert: 仍在微信文件选择列表中，仅「qa-import-cube-10mm.stl」一项被勾选，底部「确定」按钮可点击。
      - aiTap: 文件列表底部的「确定」按钮
      - aiWaitFor: 文件回传完成，本次选中的 STL 显示可操作的「确认导入」
        timeout: 240000
      - aiTap: 本次文件的「确认导入」
      - aiWaitFor: 回到智小白3D，导入模型的「下一步」可用，或三维模型摆放编辑器已加载
        timeout: 120000
      - ai: 若当前已在三维摆放编辑器中，显示模型尺寸和缩放，结束本步骤；仅在回传文件已就绪的导入页点击「下一步」一次。
      - aiWaitFor: 当前模型的三维摆放编辑画布已加载，有模型尺寸及底部「下一步」
        timeout: 120000
      - aiAssert: 当前导入的是立方体，100%缩放下三轴尺寸均为10毫米。
      - aiTap: 当前模型摆放编辑页底部的「下一步」
      - aiWaitFor: 本次摆放编辑器上有「请确认耗材颜色」弹窗及并排的「修改设置」「确认」，或页面顶部标题已经变成「模型打印预览」
        timeout: 30000
      - runAdbShell: >-
          file=$(mktemp /data/local/tmp/qa-kfb-preview.XXXXXX) || exit 1;
          trap 'rm -f "$file"' EXIT;
          for attempt in 1 2 3; do
          : > "$file"; uiautomator dump "$file" >/dev/null && [ -s "$file" ] || exit 1;
          if grep -Fq 'text="请确认当前使用的耗材颜色为：' "$file" && grep -Fq 'text="修改设置"' "$file"; then
          bounds=$(tr '>' '\n' < "$file" | grep -F 'text="确认"' | grep -F 'class="android.widget.Button"' | grep -F 'package="com.kfb.model"' | grep -F ' clickable="true"' | grep -F ' enabled="true"' | sed -n 's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p');
          set -- $bounds; [ "$#" -eq 4 ] || exit 1;
          input tap "$((($1+$3)/2))" "$((($2+$4)/2))"; exit $?; fi;
          if tr '>' '\n' < "$file" | grep -F 'text="模型打印预览"' | grep -F 'resource-id="com.kfb.model:id/web_title_tv_middle"' > /dev/null; then exit 0; fi;
          done; exit 1
      - aiWaitFor: 当前「模型打印预览」显示已完成切片的预计时间和模型耗材，底部同时有「取消打印」和「确认打印」
        timeout: 240000
      - aiAssert: 当前是本次编辑后连续打开的待确认预览，有预计时间、耗材及「确认打印」按钮，尚未发送打印。页面没有正在打印的进度，也没有其他任务或设备的详情。
      - aiTap: 该待确认模型打印预览页底部、与「确认打印」并列的「取消打印」
      - aiWaitFor: 本次预览中央弹窗标题「确认要取消任务吗？」及「确定」同时可见，或页面已显示「已取消模型处理」和底部「返回」
        timeout: 12000
      - aiTap: 弹窗「确认要取消任务吗？」内右侧的「确定」按钮；若中央已显示「已取消模型处理」，仅轻触中央静态提示「已取消模型处理」文字。
      - aiWaitFor: 「模型打印预览」显示「已取消模型处理」和底部「返回」按钮
        timeout: 30000
      - aiTap: 已取消模型处理页面底部的「返回」
      - aiAssert: 顶部标题包含「qa-import-cube-10mm.stl」，底部可见「下一步」，两处同时可见即表示已离开任务结果页并回到该模型编辑器。
