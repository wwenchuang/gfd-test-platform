android: {}
tasks:
- name: 浏览主题专区模型
  # baseline.case_id: COM_KFB_MODEL_32731091a24a
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航最左侧的首页房子图标
  - aiTap: 首页「主题专区」标题同行右侧的「查看全部」
  - aiWaitFor: 标题为「主题专区」，下方出现多张有封面和名称的主题卡片
    timeout: 12000
  - aiTap: 主题列表中标题为「光隅小灯具」的卡片
  - aiWaitFor: 主题详情标题为「光隅小灯具」，下方有属于该主题且带名称的模型卡片
    timeout: 12000
  - aiAssert: 主题详情标题为「光隅小灯具」，下方有属于该主题且带名称的模型卡片
