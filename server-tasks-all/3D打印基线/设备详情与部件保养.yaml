android: {}
tasks:
- name: 设备详情与部件保养
  # baseline.case_id: COM_KFB_MODEL_d4891e6003ce
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航最右侧的「我的」
  - aiTap: 个人页「我的设备」
  - aiWaitFor: 当前设备为 EP3-9888E0094F2A
    timeout: 12000
  - aiTap: 当前设备下的「更多设置」
  - aiWaitFor: 「设备详情」的「耗材与部件保养」区域已显示喷头组件和打印平台
    timeout: 12000
  - aiAssert: 「耗材与部件保养」区域的「喷头组件」和「打印平台」各自显示剩余百分比数值。
  - ai: 在设备详情列表中查看保养区域下方的规格。如果「Mac码」和「最大打印尺寸」两行尚未完整显示，向上轻滑列表，直到两行均可见；已经可见则结束本步。
  - aiAssert: 「Mac码」一行的值为 9888E0094F2A，「最大打印尺寸」一行的长、宽、高均为 100 mm。
