android: {}
tasks:
- name: 成长乐园教材分科
  # baseline.case_id: COM_KFB_MODEL_030aa062e2a3
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航的「成长」
  - aiWaitFor: 成长乐园有教材同步学、建模大冒险、科创乐园三个课程入口
    timeout: 12000
  - aiTap: 成长乐园「教材同步学」卡片上的「进入课程」
  - aiWaitFor: 课程内容或带「我知道了」按钮的「体验提示」可见
    timeout: 20000
  - ai: 若出现「体验提示」且提示下载智小白HD，只点击「我知道了」一次；课程内容已经可见则结束。
  - aiWaitFor: 教材同步学课程列表有「数学」「语文」「英语」学科标签
    timeout: 12000
  - aiTap: 课程页底部「英语」学科标签
  - aiWaitFor: 「英语」已选中，并显示英语课程卡片、上次学习进度或该科目明确的空状态
    timeout: 12000
  - aiAssert: 「英语」已选中，并显示英语课程卡片、上次学习进度或该科目明确的空状态
