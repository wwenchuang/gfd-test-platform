android:

tasks:
  - name: OBJ保龄球打印
    # baseline.case_id: COM_KFB_MODEL_391142ea35f9
    # baseline.goal: 验证OBJ保龄球打印
    # baseline.start_page: App 首页
    # baseline.path: 首页搜索保龄球套装 -> 迷你保龄球套装 -> 查看全部 -> 保龄球 -> 去打印 -> 下一步 -> 返回
    # baseline.expected: OBJ保龄球打印相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - aiWaitFor: "App 首页已加载完成，右上角搜索入口或底部导航可见"
        timeout: 60000
      - aiAction: "首页遗留切片任务清理：如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」进入「模型打印预览」；在预览页点击底部「取消打印」，弹出「确认要取消任务吗？」时点击「确定」，然后返回 App 首页。若首页没有该横幅/入口，则不要点击任何内容，直接继续。"
      - sleep: 1000
      - aiTap: "右上角放大镜搜索图标或搜索入口"
      - aiInput: "当前页面的搜索输入框或文本输入框"
        value: "保龄球"
      - aiKeyboardPress: "当前页面的搜索输入框或文本输入框"
        keyName: "Enter"
      - aiWaitFor: "搜索结果中出现「迷你保龄球套装」"
        timeout: 60000
      - aiTap: "迷你保龄球套装"
      - aiWaitFor: "套装详情或推荐列表页面已打开，能看到「查看全部」"
        timeout: 60000
      - aiTap: "查看全部"
      - aiWaitFor: "完整列表中出现「保龄球」模型"
        timeout: 60000
      - aiTap: "保龄球"
      - aiWaitFor: "保龄球模型详情页已打开，页面中央不再显示「加载中」或加载百分比遮罩，3D 模型预览加载完成，页面底部出现可点击的「去打印」按钮"
        timeout: 180000
      - aiTap: "去打印"
      - aiWaitFor: "当前 3D 预览或模型打印编辑页面加载完成，页面不再显示「加载中」进度，且底部出现可点击的「去打印」或「下一步」按钮"
        timeout: 240000
      - ai: "只判断当前截图，最多点击一次：如果底部蓝色主按钮文字是「去打印」，点击该「去打印」；如果底部主按钮已经是「下一步」，不要点击并立即完成；如果出现「请确认耗材颜色」弹窗或「取消打印」按钮，也不要操作。不要重复点击，不要等待页面变化。"
      - ai: "如果页面出现「请确认耗材颜色」弹窗，则点击蓝色「确认」按钮（弹窗右下角）；如果没有弹窗则不要操作"
      - aiWaitFor: "模型打印编辑页加载完成，页面不再显示「加载中」进度，底部「下一步」按钮已变为蓝色可点击状态"
        timeout: 120000
      - aiTap: "底部蓝色「下一步」按钮"
      - aiWaitFor: "页面已进入模型处理或打印预览流程：要么出现「请确认耗材颜色」弹窗，要么页面出现可点击的「取消打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "如果当前页面弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "确认耗材后页面已继续：要么页面出现可点击的「取消打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "确认耗材后只判断当前截图，最多再点击一次：如果仍在模型打印编辑页且底部显示蓝色「下一步」按钮，则再点击一次该「下一步」；如果已经出现「取消打印」按钮，或仍然存在「请确认耗材颜色」弹窗，则不要操作"
      - ai: "如果当前页面再次弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "模型处理进度完成，页面出现可点击的「取消打印」按钮"
        timeout: 240000
      - ai: "取消清理只判断当前截图，最多点击一次：如果出现「确认要取消任务吗」弹窗，点击「确定」；否则如果页面有「取消打印」或「取消处理」按钮，点击该取消按钮；如果页面已显示「已取消模型处理」、底部有「重新编辑」或「返回」按钮，则不要操作"
      - ai: "取消确认只判断当前截图，最多点击一次：如果出现确认取消、确定或确认弹窗，点击确认按钮；如果页面仍有「取消打印」或「取消处理」按钮，点击该取消按钮；如果已经离开模型打印预览页或页面已显示「已取消模型处理」，则不要操作"
      - aiWaitFor: "已离开模型打印预览确认页，或底部不再同时显示「取消打印」和「确认打印」按钮"
        timeout: 60000
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
