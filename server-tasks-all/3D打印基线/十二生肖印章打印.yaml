android: {}
tasks:
- name: 十二生肖印章打印
  # baseline.case_id: COM_KFB_MODEL_eae567b5f2ba
  # baseline.goal: 验证十二生肖印章打印
  # baseline.start_page: App 首页
  # baseline.path: 首页印章 → 单章DIY → 图案／十二生肖／牛 → 盖印效果 → 试盖效果 → 选择把手 → 生成牛印章 → 打印预览及取消返回
  # baseline.expected: 目标模型进入打印预览，完成切片，取消本次模型处理并返回。
  # baseline.repair_hint: 2.0.2（56）的单章DIY覆盖牛图案印面与独立把手。旧版立体牛柄、姓名印面及印盒盖组件需独立模板验证。
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 底部导航可见「创作」和「我的」，最左侧可见房子图标
    timeout: 12000
  - aiTap: 底部导航最左侧的房子图标
  - aiWaitFor: 首页顶部显示当前打印机的设备卡片，快捷入口中同时可见「印章」和「导入打印」
    timeout: 12000
  - aiAssert: 首页选中 EP3-9888E0094F2A，状态为「空闲」，没有待处理、待打印或模型处理完成的任务横幅
  - aiTap: 首页快捷功能中的「印章」
  - aiWaitFor: 印章页可见「单章DIY」卡片与「立即定制」按钮
    timeout: 12000
  - aiTap: 「单章DIY」卡片中的「立即定制」
  - aiWaitFor: 单章DIY 设计印面的图案页显示「十二生肖」分类
    timeout: 12000
  - aiTap: 图案分类中的「十二生肖」
  - aiWaitFor: 「十二生肖」分类中显示「牛」图案
    timeout: 12000
  - aiTap: 十二生肖网格内标为「牛」的印面图案
  - aiAssert: 「牛」图案带选中标记，印面预览显示牛图案
  - aiWaitFor: 印面设计页的「下一步：盖印效果」按钮可用
    timeout: 12000
  - aiTap: 印面设计页底部「下一步：盖印效果」
  - aiWaitFor: 「盖印效果」页显示图案有色、背景有色及图案尺寸
    timeout: 12000
  - aiTap: 「选择图案尺寸」区域的 40mm 标准尺寸
  - aiAssert: 40mm 标准尺寸带选中边框
  - aiTap: 盖印效果页底部「下一步：试盖效果」
  - aiWaitFor: 试盖效果页显示可盖印的纸张区域和「选择印泥颜色」
    timeout: 12000
  - aiTap: 试盖效果页中提示点击盖印的纸张区域
  - aiAssert: 纸张区域已出现牛图案的盖印图样
  - aiTap: 试盖效果页底部「下一步：选择把手」
  - aiWaitFor: 选择把手步骤已显示
    timeout: 12000
  - aiTap: 选择把手页「巧克力球」样式
  - aiWaitFor: 「巧克力球」把手样式已选中
    timeout: 12000
  - aiTap: 选择把手页底部「下一步：完成」
  - aiWaitFor: 「制作完成」及「你的印章已生成」出现，显示作品名称、已自动保存至生成记录和「去打印」
    timeout: 240000
  - aiAssert: 单章DIY 完成页的作品名称为「牛印章」，页面显示印章三维预览与「去打印」
  - aiTap: 单章DIY 制作完成页底部「去打印」
  - aiWaitFor: 模型打印编辑页已显示构建板中的模型，加载遮罩消失，底部「下一步」为可点击状态
    timeout: 120000
  - aiTap: 模型打印编辑页底部蓝色「下一步」按钮
  - aiWaitFor: 出现「请确认耗材颜色」弹窗或已进入「模型打印预览」页
    timeout: 12000
  - ai: 仅当标题为「请确认耗材颜色」的弹窗可见时，点击该弹窗内的「确认」一次并结束；若已进入模型打印预览页则直接结束。
  - aiWaitFor: 「请确认耗材颜色」弹窗已关闭，页面为模型打印预览，或仍在显示当前模型和可用「下一步」按钮的编辑页
    timeout: 12000
  - ai: 仅在确认耗材后返回本次模型打印编辑页且「下一步」可用时，点击「下一步」一次；已进入预览或处理中时直接结束。
  - aiWaitFor: 标题为「模型打印预览」，或出现「请确认耗材颜色」弹窗
    timeout: 30000
  - ai: 若再次弹出「请确认耗材颜色」，仅点击该弹窗的「确认」一次；已进入预览时直接结束。
  - aiWaitFor: 模型打印预览页显示处理完成的牛图案印章，能看到模型几何预览及「确认打印」按钮
    timeout: 240000
  - aiAssert: 当前是本次牛图案印章的模型打印预览，同时显示「取消打印」和「确认打印」按钮。页面未进入设备工作或打印队列。
  - aiTap: 模型打印预览底部的「取消打印」按钮
  - aiWaitFor: 出现取消本次模型处理的确认弹窗，或模型打印预览页已显示「已取消模型处理」
    timeout: 12000
  - ai: 只在当前取消模型处理的二次确认弹窗内点击肯定取消任务的「确定」或「确认」一次并结束；若已显示「已取消模型处理」，直接结束。
  - aiWaitFor: 模型打印预览显示「已取消模型处理」，下方有「返回」按钮
    timeout: 12000
  - aiTap: 已取消模型处理页面的「返回」按钮
  - aiWaitFor: 返回后出现首页底部导航，或回到有模型标题的详情页、编辑页或印章配置页
    timeout: 12000
  - aiAssert: 已离开模型打印预览页，出现首页导航、原模型详情或编辑配置控件
