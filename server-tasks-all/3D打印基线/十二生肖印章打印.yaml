android: {}
tasks:
- name: 十二生肖印章打印
  # baseline.case_id: COM_KFB_MODEL_eae567b5f2ba
  # baseline.goal: 验证十二生肖印章打印
  # baseline.start_page: App 首页
  # baseline.path: 首页印章 → 单章DIY → 图案／十二生肖／牛 → 盖印效果 → 试盖效果 → 选择把手 → 生成牛印章 → 打印预览及取消返回
  # baseline.expected: 目标模型进入打印预览，完成切片，取消本次模型处理并返回。
  # baseline.repair_hint: 2.0.2（56）的单章DIY覆盖牛图案印面与独立把手。旧版立体牛柄、姓名印面及印盒盖组件需独立模板验证。
  flow:
  - runAdbShell: am force-stop com.kfb.model
  # 上一条用例可能停在 Android 文件选择器。仅重建本应用的任务栈。
  - runAdbShell: am start -W -f 0x10008000 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.kfb.model/.splash.SplashActivity
  - launch: com.kfb.model
  - aiWaitFor: 底部导航可见「创作」和「我的」，最左侧可见房子图标
    timeout: 12000
  - aiTap: 底部导航最左侧的房子图标
  - aiWaitFor: 首页的 EP3-9888E0094F2A 设备卡片已刷新，明确显示「空闲」，或已显示打印中、任务待处理等占用状态
    timeout: 35000
  - aiAssert: 首页选中 EP3-9888E0094F2A，状态为「空闲」，没有待处理、待打印或模型处理完成的任务横幅
  - aiTap: 首页快捷功能中的「印章」
  - aiWaitFor: 印章页可见「单章DIY」卡片与「立即定制」按钮
    timeout: 12000
  - aiTap: 「单章DIY」卡片中的「立即定制」
  - aiWaitFor: 单章DIY 设计印面的图案页显示「十二生肖」分类
    timeout: 12000
  - aiTap: 图案分类中的「十二生肖」
  - aiWaitFor: 「十二生肖」分类中显示「牛」图案
    timeout: 12000
  - aiTap: 十二生肖网格内标为「牛」的印面图案
  - aiAssert: 「牛」图案带选中标记，印面预览显示牛图案
  - aiWaitFor: 印面设计页的「下一步：盖印效果」按钮可用
    timeout: 12000
  - aiTap: 印面设计页底部「下一步：盖印效果」
  - aiWaitFor: 「盖印效果」页显示图案有色、背景有色及图案尺寸
    timeout: 12000
  - aiTap: 「选择图案尺寸」区域的 40mm 标准尺寸
  - aiAssert: 40mm 标准尺寸带选中边框
  - aiTap: 盖印效果页底部「下一步：试盖效果」
  - aiWaitFor: 试盖效果页显示可盖印的纸张区域和「选择印泥颜色」
    timeout: 12000
  - aiTap: 试盖效果页中提示点击盖印的纸张区域
  - aiAssert: 纸张区域已出现牛图案的盖印图样
  - aiTap: 试盖效果页底部「下一步：选择把手」
  - aiWaitFor: 选择把手步骤已显示
    timeout: 12000
  - aiTap: 选择把手页「巧克力球」样式
  - aiWaitFor: 「巧克力球」把手样式已选中
    timeout: 12000
  - aiTap: 选择把手页底部「下一步：完成」
  - aiWaitFor: 「制作完成」及「你的印章已生成」出现，显示作品名称、已自动保存至生成记录和「去打印」
    timeout: 240000
  - aiAssert: 单章DIY 完成页的作品名称为「牛印章」，页面显示印章三维预览与「去打印」
  - aiTap: 单章DIY 制作完成页底部「去打印」
  - aiWaitFor: 出现「盖印前，记得先打磨」提示和「知道了」，或出现「打印准备」并显示印章的把手和印面
    timeout: 20000
  - ai: 若「盖印前，记得先打磨」提示可见，只点「知道了」一次；如果已经显示「打印准备」，直接结束。
  - aiWaitFor: 标题为「打印准备」，页面显示共2个打印任务和底部「开始打印」
    timeout: 60000
  - aiAssert: 本次印章的两个任务分别包含把手和印面，第一项标明首先打印。没有更换设备、打印机忙或已有其他任务的提示。
  - aiTap: 本次印章「打印准备」底部的「开始打印」按钮一次
  - aiWaitFor: 顶部显示「第1盘」，构建板已加载本次印章把手，左侧有「居中」「旋转」，底部可点击「下一步」
    timeout: 90000
  - aiTap: 「第1盘」编辑页底部蓝色「下一步」
  - aiWaitFor: 本次摆放编辑器上有「请确认耗材颜色」弹窗及并排的「修改设置」「确认」，或页面顶部标题已经变成「模型打印预览」
    timeout: 30000
  - runAdbShell: >-
      file=$(mktemp /data/local/tmp/qa-kfb-preview.XXXXXX) || exit 1;
      trap 'rm -f "$file"' EXIT;
      for attempt in 1 2 3; do
      : > "$file"; uiautomator dump "$file" >/dev/null && [ -s "$file" ] || exit 1;
      if grep -Fq 'text="请确认当前使用的耗材颜色为：' "$file" && grep -Fq 'text="修改设置"' "$file"; then
      bounds=$(tr '>' '\n' < "$file" | grep -F 'text="确认"' | grep -F 'class="android.widget.Button"' | grep -F 'package="com.kfb.model"' | grep -F ' clickable="true"' | grep -F ' enabled="true"' | sed -n 's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p');
      set -- $bounds; [ "$#" -eq 4 ] || exit 1;
      input tap "$((($1+$3)/2))" "$((($2+$4)/2))"; exit $?; fi;
      if tr '>' '\n' < "$file" | grep -F 'text="模型打印预览"' | grep -F 'resource-id="com.kfb.model:id/web_title_tv_middle"' > /dev/null; then exit 0; fi;
      done; exit 1
  - aiWaitFor: 「模型打印预览」底部同一行左边按钮全文为「取消打印」、右边按钮全文为「确认打印」。处理中的「取消处理」已消失，结果卡片的「预计时间」显示具体时长，「模型耗材」显示带 g 的数值。
    timeout: 240000
  - aiWaitFor: 模型打印预览中央的三维画布已经显示本盘的立体把手，能看见清晰的外轮廓和把手表面的纹理。
    timeout: 90000
  - aiAssert: 当前是本次第一盘的模型打印预览，预览中可见把手，底部同时显示「取消打印」和「确认打印」，尚未提交到设备打印
  - aiTap: 模型打印预览底部的「取消打印」按钮
  - aiWaitFor: 本次预览中央弹窗标题「确认要取消任务吗？」及「确定」同时可见，或页面已显示「已取消模型处理」和底部「返回」
    timeout: 12000
  - aiTap: 弹窗「确认要取消任务吗？」内右侧的「确定」按钮；若中央已显示「已取消模型处理」，仅轻触中央静态提示「已取消模型处理」文字。
  - aiWaitFor: 模型打印预览显示「已取消模型处理」，下方有「返回」按钮
    timeout: 12000
  - aiTap: 已取消模型处理页面的「返回」按钮
  - aiWaitFor: 取消后已离开预览，回到本次「第1盘」及「下一步」的编辑页，或回到有把手和印面两项的「打印准备」页
    timeout: 25000
  - aiAssert: 当前显示「第1盘」的编辑控件及「下一步」，或印章「打印准备」两盘列表。已离开「已取消模型处理」结果页。
