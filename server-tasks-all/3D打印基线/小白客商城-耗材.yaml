android: {}
tasks:
- name: 小白客商城-耗材
  # baseline.case_id: COM_KFB_MODEL_9b7d287f912f
  # baseline.path: 我的 → 耗材商城 → 核对商品列表
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 底部导航栏右侧可见「我的」
    timeout: 12000
  - aiTap: 底部导航栏的「我的」
  - aiWaitFor: 当前为个人页，显示「我的设备」和「打印记录」
    timeout: 12000
  - aiTap: 个人页快捷入口「耗材商城」
  - aiWaitFor: 智小白 App 的「温馨提示」弹窗显示即将跳转至第三方小程序，右侧「立即跳转」可点
    timeout: 12000
  - aiTap: 此「温馨提示」弹窗右下方的蓝色「立即跳转」按钮
  - aiWaitFor: 安卓系统的确认框完整显示「取消」和「打开」两个按钮，或微信商城小程序已出现
    timeout: 15000
  - ai: 只在安卓系统出现「智小白3D」想要打开「微信」小程序的提示时，点击右侧「打开」一次。保留「始终允许打开」当前状态。若已进入微信小程序则结束本步骤。
  - aiWaitFor: 微信商城中可见「智小白3D耗材」商品区标题或有 PLA 耗材商品卡片
    timeout: 30000
  - ai: 在耗材区内查看商品，若耗材商品卡片下方售价未露出，向下浏览至耗材名称和对应售价同时可见，不点击购买。
  - aiWaitFor: 微信商城已打开并显示带商品名称和价格的耗材卡片；停留在个人页「耗材商城」入口或出现微信未安装提示均未完成跳转
    timeout: 25000
  - aiAssert: 耗材商城有可识别的耗材商品及价格，无空白页或网络错误
