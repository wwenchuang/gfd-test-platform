android: {}
tasks:
- name: 关节龙打印
  # baseline.case_id: COM_KFB_MODEL_f14f42c5f10b
  # baseline.path: 指定设备空闲 → 搜索关节龙 → 模型与设备核对 → 提交 → 本次任务回执
  flow:
  - runAdbShell: am force-stop com.kfb.model
  # 上一条用例可能停在 Android 文件选择器。仅重建本应用的任务栈。
  - runAdbShell: am start -W -f 0x10008000 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.kfb.model/.splash.SplashActivity
  - launch: com.kfb.model
  - aiWaitFor: 首页的 EP3-9888E0094F2A 设备卡片已刷新，明确显示「空闲」，或已显示打印中、任务待处理等占用状态
    timeout: 35000
  - aiAssert: 当前选中设备编号完整为 9888E0094F2A，明确显示「空闲」，页面没有显示「模型处理完成」「去处理」或待打印任务横幅。离线、打印中、忙、处理中、排队或设备状态不明确均失败
  - aiTap: 首页右上角放大镜搜索入口
  - aiInput: 模型搜索页的搜索输入框
    value: 关节龙
  - aiKeyboardPress: 模型搜索输入框
    keyName: Enter
  - aiWaitFor: 模型搜索结果里有名称完全匹配「关节龙」的模型卡片
    timeout: 20000
  - aiTap: 名称完全匹配「关节龙」的模型结果卡片
  - aiWaitFor: 关节龙模型详情已加载，标题为「关节龙」，下方有「去打印」
    timeout: 45000
  - aiAssert: 模型详情标题和「模型文件」卡片中的文件名均完整为「关节龙」
  - aiTap: 模型详情底部「去打印」按钮
  - aiWaitFor: 编辑器顶部标题为「关节龙」，构建板上已渲染盘曲的分节龙形模型，底部「下一步」可点击
    timeout: 150000
  - aiTap: 编辑器底部「下一步」
  - ai: 仅当「请确认耗材颜色」提示已显示时点击其中的「确认」，其他情况结束本步骤。
  - aiWaitFor: 「模型打印预览」已渲染盘曲的分节龙形模型，显示预计时间、耗材重量和「确认打印」，或者出现弱网、设备不可用、已有任务或切片失败提示
    timeout: 240000
  - aiAssert: 预览中清楚显示盘曲的分节龙形模型、预计时间、耗材重量及设备就绪提示，底部同时有「取消打印」和「确认打印」。出现「网络信号差」、设备忙、离线、排队、已有任务「去处理」或切片失败时均失败
  - aiTap: 本次模型打印预览底部右侧的「确认打印」
  - aiWaitFor: 出现「检查无误确认打印」安全检查页，或者出现「网络信号差」或已有任务待处理的弹窗
    timeout: 12000
  - ai: 如果有标题为「网络信号差」且同时显示「继续打印」「去调整网络」的提示，只点击「继续打印」一次。如果已进入打印安全检查页，直接结束。其他状态不要操作，不要重新提交打印。
  - aiAssert: 屏幕显示打印安全检查页，页面无「网络信号差」和待处理任务弹窗
  - aiWaitFor: 打印安全检查页出现「检查无误确认打印」
    timeout: 12000
  - aiAssert: 本次安全检查页的打印确认信息明确对应 9888E0094F2A，当前设备显示空闲或就绪并允许立即开始。缺少设备标识、不可用、离线、占用、重复任务、只能排队或要求重新选择机器时均失败。
  - aiTap: 安全检查页的「检查无误确认打印」按钮一次
  - aiWaitFor: 已显示本次提交成功或开始打印的结果页，并有「返回首页」入口
    timeout: 90000
  - aiTap: 本次结果页的「返回首页」
  - aiWaitFor: 首页显示设备 9888E0094F2A 和当前打印任务
    timeout: 60000
  - aiAssert: 当前设备完整编号为 9888E0094F2A，当前打印任务名为关节龙且处于下载、预热、打印或已完成状态；空闲、仅生成预览、排队中或仅显示旧历史记录均不满足
