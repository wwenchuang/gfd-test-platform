# Main-platform HTML, JavaScript and CSS use stable URLs. Revalidate them so a
# normal browser refresh sees the files from the latest deployment. API Test
# keeps its hashed bundles cacheable while its SPA entry document revalidates.
map $uri $midscene_static_cache_control {
    default "";
    ~^/$ "no-cache, must-revalidate";
    ~^/(task-manager|trace-viewer)\.html$ "no-cache, must-revalidate";
    ~^/(js|css|assets)/ "no-cache, must-revalidate";
    ~^/api-test/?$ "no-cache, must-revalidate";
    ~^/api-test/index\.html$ "no-cache, must-revalidate";
}

add_header Cache-Control $midscene_static_cache_control always;
