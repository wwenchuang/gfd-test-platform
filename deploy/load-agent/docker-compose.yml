services:
  load-agent:
    image: ${LOAD_AGENT_IMAGE:-midscene-load-agent:0.1.2}
    build:
      context: ../..
      dockerfile: load_agent/Dockerfile
      args:
        K6_IMAGE: ${K6_IMAGE:-grafana/k6:0.52.0}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.5-slim-bookworm}
    env_file:
      - .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - load-agent-data:/var/lib/midscene-load-agent
    mem_limit: ${LOAD_AGENT_MEMORY_LIMIT:-2g}
    cpus: ${LOAD_AGENT_CPU_LIMIT:-2.0}
    pids_limit: ${LOAD_AGENT_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/midscene-load-agent/credential.json && k6 version >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s

volumes:
  load-agent-data:
