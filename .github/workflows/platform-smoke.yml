name: Platform smoke
on:
  pull_request:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: Smoke profile
        options: [pr, nightly, wrong-title]
        default: pr
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.20'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
      - name: Install locked dependencies and run platform smokes
        env:
          PROFILE: ${{ inputs.profile || (github.event_name == 'schedule' && 'nightly' || 'pr') }}
        run: bash tests/week6_ci/run.sh "$RUNNER_TEMP/platform-smoke" "$PROFILE"
      - name: Retain logs, API results, screenshot and trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-smoke
          retention-days: 14
          if-no-files-found: warn
