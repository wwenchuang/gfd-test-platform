android: {}
tasks:
- name: 关节龙打印
  # baseline.case_id: COM_KFB_MODEL_f14f42c5f10b
  # baseline.path: 指定设备空闲 → 搜索关节龙 → 模型与设备核对 → 提交 → 本次任务回执
  flow:
  - runAdbShell: am force-stop com.kfb.model
  # 上一条用例可能停在 Android 文件选择器。仅重建本应用的任务栈。
  - runAdbShell: am start -W -f 0x10008000 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.kfb.model/.splash.SplashActivity
  - launch: com.kfb.model
  - aiWaitFor: 首页的 EP3-9888E0094F2A 设备卡片已刷新，明确显示「空闲」，或已显示打印中、任务待处理等占用状态
    timeout: 35000
  - aiAssert: 当前选中设备编号完整为 9888E0094F2A，明确显示「空闲」，页面没有显示「模型处理完成」「去处理」或待打印任务横幅。离线、打印中、忙、处理中、排队或设备状态不明确均失败
  - aiTap: 首页右上角放大镜搜索入口
  - aiInput: 模型搜索页的搜索输入框
    value: 关节龙
  - aiKeyboardPress: 模型搜索输入框
    keyName: Enter
  - aiWaitFor: 模型搜索结果里有名称完全匹配「关节龙」的模型卡片
    timeout: 20000
  - aiTap: 名称完全匹配「关节龙」的模型结果卡片
  - aiWaitFor: 关节龙模型详情已加载，标题为「关节龙」，下方有「去打印」
    timeout: 45000
  - aiAssert: 模型详情标题和「模型文件」卡片中的文件名均完整为「关节龙」
  - aiTap: 模型详情底部「去打印」按钮
  - aiWaitFor: 编辑器顶部标题为「关节龙」，构建板上已渲染盘曲的分节龙形模型，底部「下一步」可点击
    timeout: 150000
  - runAdbShell: |-
      # dragon: start slice window
      set -eu
      state=/data/local/tmp/qa-kfb-dragon
      umask 077
      rm -f "$state.window" "$state.bound"
      date '+%s %Y-%m-%d %H:%M:%S' > "$state.window"
  - aiTap: 编辑器底部「下一步」
  - aiWaitFor: 本次摆放编辑器上有「请确认耗材颜色」弹窗及并排的「修改设置」「确认」，或页面顶部标题已经变成「模型打印预览」
    timeout: 30000
  - runAdbShell: >-
      file=$(mktemp /data/local/tmp/qa-kfb-preview.XXXXXX) || exit 1;
      trap 'rm -f "$file"' EXIT;
      for attempt in 1 2 3; do
      : > "$file"; uiautomator dump "$file" >/dev/null && [ -s "$file" ] || exit 1;
      if grep -Fq 'text="请确认当前使用的耗材颜色为：' "$file" && grep -Fq 'text="修改设置"' "$file"; then
      bounds=$(tr '>' '\n' < "$file" | grep -F 'text="确认"' | grep -F 'class="android.widget.Button"' | grep -F 'package="com.kfb.model"' | grep -F ' clickable="true"' | grep -F ' enabled="true"' | sed -n 's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p');
      set -- $bounds; [ "$#" -eq 4 ] || exit 1;
      input tap "$((($1+$3)/2))" "$((($2+$4)/2))"; exit $?; fi;
      if tr '>' '\n' < "$file" | grep -F 'text="模型打印预览"' | grep -F 'resource-id="com.kfb.model:id/web_title_tv_middle"' > /dev/null; then exit 0; fi;
      done; exit 1
  - &dragon_preview_ready
    runAdbShell: |-
      # Verify the rendered GCode canvas in two consecutive Android accessibility snapshots.
      set -eu
      file=$(mktemp /data/local/tmp/qa-kfb-render.XXXXXX)
      trap 'rm -f "$file" "$file.err"' EXIT
      deadline=$(($(date +%s)+210))
      stable=0
      while [ "$(date +%s)" -lt "$deadline" ]; do
        : > "$file"
        dump_status=0
        uiautomator dump "$file" >/dev/null 2>"$file.err" || dump_status=$?
        if [ -s "$file.err" ]; then
          if grep -Fqx 'ERROR: could not get idle state.' "$file.err" && ! grep -Fvxq 'ERROR: could not get idle state.' "$file.err"; then
            stable=0
            sleep 1
            continue
          fi
          cat "$file.err" >&2
          exit 1
        fi
        [ "$dump_status" -eq 0 ] || { echo "UI hierarchy dump failed with status $dump_status" >&2; exit 1; }
        if awk '
          BEGIN { RS=">" }
          function attr(key, v) {
            v=$0; if (!sub(".* " key "=\"", "", v)) return ""
            sub("\".*", "", v); return v
          }
          function coords(box, a) {
            if (box !~ /^\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]$/) return 0
            gsub(/[^0-9]+/, " ", box); split(substr(box,2),a," ")
            return a[3]+0>a[1]+0 && a[4]+0>a[2]+0
          }
          /<node / {
            d++; t=attr("text"); c=attr("class"); id=attr("resource-id"); box=attr("bounds")
            if (attr("package")!="com.kfb.model") bad=1
            if (id=="com.kfb.model:id/web_title_tv_middle" && t=="模型打印预览") title++
            if (c=="android.webkit.WebView" && t=="GCode 查看器 - 3D打印文件预览") {
              viewers++; viewer=d; if (!coords(box,web)) bad=1
            }
            if (viewer && id=="app" && c=="android.view.View") { apps++; app=d }
            if (app) {
              if (t ~ /正在加载|正在渲染|模型处理中|处理完成后直接打印|取消处理/) busy++
              if (c=="android.widget.TextView" && attr("enabled")=="true") {
                if (t=="预计时间") estimate++
                if (t ~ /^([0-9]+小时)?([0-9]+分钟)?([0-9]+秒)?$/ && t ~ /[1-9]/) times++
                if (t=="模型耗材") material++
                if (t ~ /^[0-9]+([.][0-9]+)?g$/ && t+0>0) weight++
                if (t=="设备状态完美") ready++
                if (t=="" && $0 ~ /\/$/ && kind[d-1]=="android.view.View" && box==boxes[d-1] &&
                    coords(box,rect) && rect[1]==web[1] && rect[2]==web[2] && rect[3]==web[3] && rect[4]+0<web[4]+0) canvas++
              }
              if (c=="android.widget.Button" && attr("enabled")=="true" && attr("clickable")=="true") {
                if (t=="取消打印") cancel++
                if (t=="确认打印") confirm++
              }
            }
            boxes[d]=box; kind[d]=c
            if ($0 !~ /\/$/) next
          }
          /<node |<\/node/ { if (d==app) app=0; if (d==viewer) viewer=0; d-- }
          END { exit (bad || d || busy || title!=1 || viewers!=1 || apps!=1 || canvas!=1 || estimate!=1 ||
                      times!=1 || material!=1 || weight!=1 || ready!=1 || cancel!=1 || confirm!=1) }
        ' "$file"; then
          stable=$((stable+1))
          if [ "$stable" -eq 2 ]; then echo 'preview canvas ready in two successive observations'; exit 0; fi
        else stable=0; fi
        sleep 1
      done
      echo 'GCode preview did not reach a stable rendered canvas' >&2
      exit 1
    timeout: 240000
  - aiWaitFor: 浅灰色预览画布中央完整显示红色盘曲成环的立体关节龙，能看清龙头轮廓和沿弯曲龙身连续的分节。
    timeout: 240000
  - aiAssert: 预览中清楚显示盘曲的分节龙形模型、预计时间、耗材重量及设备就绪提示，底部同时有「取消打印」和「确认打印」。出现「网络信号差」、设备忙、离线、排队、已有任务「去处理」或切片失败时均失败
  # 打开此前实机验证能返回预览的记录标题。仅在同一设备、本次切片时间窗内出现唯一新记录时继续。
  - runAdbShell: am start -W -f 0x10008000 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.kfb.model/.splash.SplashActivity
  - aiWaitFor: 首页顶部显示 EP3-9888E0094F2A、空闲及本次切片的「模型处理完成」横幅，底部导航有「我的」
    timeout: 25000
  - aiTap: 底部导航最右侧的「我的」
  - aiWaitFor: 个人页中「我的设备」和「打印记录」均已显示
    timeout: 12000
  - aiTap: 个人页的「打印记录」入口
  - aiWaitFor: 打印记录页设备筛选栏显示 EP3-9888E0094F2A，最新的关节龙记录已显示模型处理完成、打印编号及打印按钮
    timeout: 20000
  - runAdbShell: |-
      # dragon: open the fresh record for the selected printer
      set -eu
      state=/data/local/tmp/qa-kfb-dragon
      read -r start since < "$state.window"
      rm -f "$state.window" "$state.bound"
      now=$(date +%s)
      case "$start" in ''|*[!0-9]*) exit 1 ;; esac
      [ "$now" -gt "$start" ] && [ "$((now-start))" -le 600 ] || exit 1
      until=$(date '+%Y-%m-%d %H:%M:%S')
      file=$(mktemp /data/local/tmp/qa-kfb-dragon.XXXXXX)
      trap 'rm -f "$file"' EXIT
      uiautomator dump "$file" >/dev/null
      selection=$(awk -v since="$since" -v until="$until" '
        BEGIN { RS=">" }
        function attr(key, v) {
          v=$0
          if (!sub(".* " key "=\"", "", v)) return ""
          sub("\".*", "", v)
          return v
        }
        function visibleBox(box, b) {
          if (box !~ /^\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]$/) return 0
          gsub(/[^0-9]+/," ",box); split(substr(box,2),b," ")
          return b[3]+0>b[1]+0 && b[4]+0>b[2]+0
        }
        function finish() {
          if (dates!=1 || stamp==since || stamp>until || (previous!="" && stamp>previous)) bad=1
          if (stamp>since) {
            fresh++
            if (row!=1 || model!=1 || numbers!=1 || done!=1 || buttons!=1 || usable!=1) bad=1
            sn=number
            target=box
          } else earlier++
          previous=stamp
          dates=model=numbers=done=buttons=usable=0
          number=box=stamp=""
        }
        /<node / {
          d++
          if (attr("package")!="com.kfb.model") bad=1
          t=attr("text"); sub(/[[:space:]]+$/, "", t)
          cls=attr("class")
          if (t=="打印记录") title++
          if (t ~ /^EP3-/) { devices++; if (t!="EP3-9888E0094F2A") bad=1 }
          if (cls=="android.widget.ListView") { lists++; list=d }
          else if (list && d==list+1) { row++; item=d }
          else if (item) {
            if (t ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9] [0-9][0-9]:[0-9][0-9]:[0-9][0-9]$/) { dates++; stamp=t }
            if (t=="关节龙") { model++; box=attr("bounds") }
            if (index(t,"打印编号：")==1) {
              numbers++; number=substr(t,length("打印编号：")+1)
              if (number !~ /^[0-9]+$/ || length(number)!=19 || seen["sn" number]++) bad=1
            }
            if (t=="模型处理完成") done++
            if (d==item+1 && cls=="android.widget.TextView" && t=="打印") {
              buttons++
              if (attr("enabled")=="true" && visibleBox(attr("bounds"))) usable++
            }
          }
          if ($0 ~ /\/$/) { if (d==item) { finish(); item=0 }; d-- }
          next
        }
        /<\/node/ { if (d==item) { finish(); item=0 }; if (d==list) list=0; d-- }
        END {
          if (bad || d || title!=1 || devices!=1 || lists!=1 || fresh!=1 || earlier<1) exit 1
          if (!visibleBox(target)) exit 1
          gsub(/[^0-9]+/," ",target); split(substr(target,2),b," ")
          printf "%s %d %d\n",sn,(b[1]+b[3])/2,(b[2]+b[4])/2
        }' "$file")
      set -- $selection
      [ "$#" -eq 3 ] || exit 1
      pid=$(pidof com.kfb.model)
      case "$pid" in ''|*[!0-9]*) exit 1 ;; esac
      umask 077
      printf '%s %s %s\n' "$1" "$pid" "$now" > "$state.bound"
      printf 'verified slice=%s printer=9888E0094F2A model=关节龙\n' "$1"
      input tap "$2" "$3"
  - *dragon_preview_ready
  - aiWaitFor: 浅灰色预览画布中央完整显示红色盘曲成环的立体关节龙，能看清龙头轮廓和沿弯曲龙身连续的分节。
    timeout: 90000
  - aiAssert: 当前记录的预览中有盘曲的分节龙形模型、正数的预计时间和模型耗材，设备状态完美，底部并列「取消打印」和「确认打印」；设备忙、需选择打印机或待处理任务均失败
  - aiTap: 本次模型打印预览底部右侧的「确认打印」
  - aiWaitFor: 出现「检查无误确认打印」安全检查页，或者出现「网络信号差」或已有任务待处理的弹窗
    timeout: 12000
  - runAdbShell: >-
      file=$(mktemp /data/local/tmp/qa-kfb-dragon.XXXXXX) || exit 1;
      trap 'rm -f "$file" "$file.nodes"' EXIT;
      uiautomator dump "$file" >/dev/null && [ -s "$file" ] || exit 1;
      tr '>' '\n' < "$file" | grep '<node ' | grep ' package="com.kfb.model"' > "$file.nodes" || exit 1;
      if grep -Fq 'resource-id="com.kfb.model:id/tv_print_confirm"' "$file.nodes"; then
      if grep -Fq 'text="网络信号差"' "$file.nodes"; then exit 1; fi; exit 0; fi;
      for label in 网络信号差 继续打印 去调整网络; do
      [ "$(grep -Fc " text=\"$label\"" "$file.nodes")" -eq 1 ] || exit 1; done;
      bounds=$(grep -F ' text="继续打印"' "$file.nodes" | grep ' clickable="true"' | grep ' enabled="true"'
      | sed -n 's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p');
      set -- $bounds; [ "$#" -eq 4 ] && [ "$3" -gt "$1" ] && [ "$4" -gt "$2" ] || exit 1;
      input tap "$((($1+$3)/2))" "$((($2+$4)/2))"
  - aiAssert: 本次原生打印安全检查弹窗同时显示「确认已安装底板并清理杂物」「确认挤出喷头干净无异物」及「检查无误，确认打印」，当前没有「网络信号差」或待处理任务弹窗。
  - runAdbShell: |-
      # dragon: consume the bound record at the native safety dialog
      set -eu
      state=/data/local/tmp/qa-kfb-dragon
      read -r sn pid checked < "$state.bound"
      rm -f "$state.bound"
      case "$sn" in ''|*[!0-9]*) exit 1 ;; esac
      [ "$(printf '%s' "$sn" | wc -c)" -eq 19 ] && [ "$pid" = "$(pidof com.kfb.model)" ] || exit 1
      case "$checked" in ''|*[!0-9]*) exit 1 ;; esac
      age=$(( $(date +%s)-checked ))
      [ "$age" -ge 0 ] && [ "$age" -le 300 ] || exit 1
      file=$(mktemp /data/local/tmp/qa-kfb-dragon.XXXXXX)
      trap 'rm -f "$file" "$file.nodes"' EXIT
      uiautomator dump "$file" >/dev/null
      tr '>' '\n' < "$file" | grep '<node ' > "$file.nodes"
      [ -s "$file.nodes" ] || exit 1
      if grep -qv ' package="com.kfb.model"' "$file.nodes"; then exit 1; fi
      match() { grep -F " resource-id=\"com.kfb.model:id/$1\"" "$file.nodes" | grep -F " text=\"$2\""; }
      [ "$(match tv_step_1 '1.确认已安装底板并清理杂物' | wc -l)" -eq 1 ] || exit 1
      [ "$(match tv_step_2 '2.确认挤出喷头干净无异物' | wc -l)" -eq 1 ] || exit 1
      bounds=$(match tv_print_confirm '检查无误，确认打印' | grep ' clickable="true"' | grep ' enabled="true"' | sed -n 's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p')
      set -- $bounds
      [ "$#" -eq 4 ] && [ "$3" -gt "$1" ] && [ "$4" -gt "$2" ] || exit 1
      printf 'submitting slice=%s printer=9888E0094F2A\n' "$sn"
      input tap "$((($1+$3)/2))" "$((($2+$4)/2))"
  - aiWaitFor: 已显示本次提交成功或开始打印的结果页，并有「返回首页」入口
    timeout: 90000
  - aiTap: 本次结果页的「返回首页」
  - aiWaitFor: 首页显示设备 9888E0094F2A 和当前打印任务
    timeout: 60000
  - aiAssert: 当前设备完整编号为 9888E0094F2A，当前打印任务名为关节龙且处于下载、预热、打印或已完成状态；空闲、仅生成预览、排队中或仅显示旧历史记录均不满足
