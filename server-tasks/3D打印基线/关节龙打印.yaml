android:

tasks:
  - name: 关节龙打印
    # baseline.case_id: COM_KFB_MODEL_f14f42c5f10b
    # baseline.goal: 验证关节龙打印
    # baseline.start_page: App 首页
    # baseline.path: 关节龙 -> 点击 去打印 按钮 -> 下一步 -> 点击 检查无误确认打印 按钮 -> 点击 返回首页 按钮
    # baseline.expected: 关节龙打印相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - ai: "启动恢复只判断当前截图，最多点击一次：如果当前页面显示「模型打印预览」「已取消模型处理」「取消打印」「确认打印」或「重新编辑」，优先点击页面可见的「返回」按钮或左上角返回箭头回到 App 首页；如果出现确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页或没有返回入口，立即完成。不要滚动，不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - sleep: 800
      - ai: "启动二次恢复只判断当前截图，最多点击一次：如果当前页面是「模型打印编辑」或模型导入后的编辑页，点击左上角返回箭头或页面「返回」按钮回到 App 首页；如果出现放弃编辑、确认退出或确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」「重新编辑」。"
      - sleep: 800
      - ai: "启动三次恢复只判断当前截图，最多点击一次：如果当前页面是模型详情页、模型部件选择页，或页面底部显示「去打印」但不是 App 首页，则点击左上角返回箭头或页面「返回」按钮离开该模型详情；如果已经在 App 首页则不要操作。不要点击「去打印」「下一步」「确认打印」「重新编辑」。"
      - sleep: 800
      - aiWaitFor: "App 首页已加载完成，右上角搜索入口或底部导航可见"
        timeout: 60000
      - ai: "首页遗留任务入口只判断当前截图，最多点击一次：如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」；如果没有该横幅或入口，立即完成。不要滚动，不要进入其他页面。"
      - ai: "遗留任务取消只判断当前截图，最多点击一次：如果当前页面有「取消打印」或「取消处理」按钮，则点击该取消按钮；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果仍在首页或没有这些按钮，立即完成。不要滚动。"
      - ai: "遗留任务确认只判断当前截图，最多点击一次：如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果页面显示「已取消模型处理」、已经回到首页、或没有确认弹窗，立即完成。不要滚动。"
      - sleep: 1000
      - aiTap: "右上角放大镜搜索图标或搜索入口"
      - aiInput: "当前页面的搜索输入框或文本输入框"
        value: "关节龙"
      - aiKeyboardPress: "当前页面的搜索输入框或文本输入框"
        keyName: "Enter"
      - aiWaitFor: "搜索结果中出现「关节龙」模型"
        timeout: 60000
      - aiTap: "关节龙"
      - aiWaitFor: "关节龙模型详情页已打开，页面出现可点击的「去打印」按钮"
        timeout: 60000
      - aiTap: "点击 去打印 按钮"
      - aiWaitFor: "模型打印编辑界面已显示，底部出现可点击的「下一步」按钮"
        timeout: 240000
      - aiTap: "下一步"
      - ai: 如果页面出现“请确认耗材颜色”弹窗，则点击蓝色“确认”按钮；如果没有出现则不操作
      - aiWaitFor: "打印确认页已加载完成，页面出现可点击的「确认打印」按钮"
        timeout: 240000
      - aiTap: "确认打印"
      - aiWaitFor: "页面出现「检查无误确认打印」按钮"
        timeout: 60000
      - aiTap: "检查无误确认打印"
      - aiWaitFor: "打印任务已提交，页面出现「返回首页」按钮"
        timeout: 120000
      - aiTap: "点击 返回首页 按钮"
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
