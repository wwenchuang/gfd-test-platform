android:

tasks:
  - name: 姓名牌打印
    # baseline.case_id: COM_KFB_MODEL_b245f8b77517
    # baseline.goal: 验证姓名牌打印
    # baseline.start_page: App 首页
    # baseline.path: 姓名牌 -> 去编辑 -> 生成模型 -> 去打印 -> 下一步 -> 返回
    # baseline.expected: 姓名牌打印相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - ai: "启动恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面显示「模型打印预览」「已取消模型处理」「取消打印」「确认打印」或「重新编辑」，优先点击页面可见的「返回」按钮或左上角返回箭头回到 App 首页；如果出现确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页或没有返回入口，立即完成。不要滚动，不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - sleep: 800
      - ai: "启动二次恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是「模型打印编辑」或模型导入后的编辑页，点击左上角返回箭头或页面「返回」按钮回到 App 首页；如果出现放弃编辑、确认退出或确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」「重新编辑」。"
      - sleep: 800
      - ai: "启动三次恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是模型详情页、模型部件选择页，或页面底部显示「去打印」但不是 App 首页，则点击左上角返回箭头或页面「返回」按钮离开该模型详情；如果已经在 App 首页则不要操作。不要点击「去打印」「下一步」「确认打印」「重新编辑」。"
      - sleep: 800
      - aiWaitFor: "App 首页已加载完成，底部导航或可编辑模型 tab 可见"
        timeout: 60000
      - sleep: 1000
      - ai: "点击可编辑模型tab即可，不要点击其他区域"
      - aiWaitFor: "模型列表页面已打开，能看到模型卡片列表"
        timeout: 60000
      - aiScroll: "模型列表区域，不要滚动顶部 tab 或底部导航"
        scrollType: "singleAction"
        direction: "down"
        distance: 450
        deepLocate: true
      - aiWaitFor: "模型列表中出现「姓名牌」模型卡片"
        timeout: 30000
      - aiTap: "名称为「姓名牌」的模型卡片"
      - aiWaitFor: "姓名牌详情页已打开，页面出现可点击的「去编辑」按钮"
        timeout: 60000
      - aiTap: "去编辑"
      - aiWaitFor: "姓名牌编辑页已加载完成：页面标题可为「编辑模型」「姓名牌」或「文字印章」，页面不再显示「加载中」弹窗，不再显示「暂无可编辑参数」，并且能看到可输入姓名或文字的文本输入框"
        timeout: 120000
      - aiInput: "姓名牌文本输入框"
        value: "UI自动化"
      - aiTap: "生成模型"
      - aiWaitFor: "模型生成完成：页面出现可点击的「去打印」按钮，或已经进入模型打印编辑界面且底部出现「下一步」按钮"
        timeout: 240000
      - ai: "只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果页面显示「去打印」按钮，则点击「去打印」；如果已经进入模型打印编辑界面且底部出现「下一步」按钮，则不要点击并立即完成"
      - aiWaitFor: "模型打印编辑界面已显示，底部出现可点击的「下一步」按钮"
        timeout: 240000
      - aiTap: "底部蓝色「下一步」按钮"
      - aiWaitFor: "页面已进入模型处理或打印预览流程：要么出现「请确认耗材颜色」弹窗，要么页面出现可点击的「取消打印」或「取消处理」按钮，要么出现「处理完成后直接打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "耗材确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "确认耗材后页面已继续：要么页面出现可点击的「取消打印」或「取消处理」按钮，要么页面出现「处理完成后直接打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "确认耗材后只判断当前截图，最多再点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果仍在模型打印编辑页且底部显示蓝色「下一步」按钮，则再点击一次该「下一步」；如果已经出现「取消打印」按钮，或仍然存在「请确认耗材颜色」弹窗，则不要操作"
      - ai: "耗材二次确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面再次弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "下一步提交后页面已继续或可安全重试：要么页面出现可点击的「取消打印」或「取消处理」按钮，要么出现「处理完成后直接打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态，要么页面中央出现「网络连接超时」提示"
        timeout: 120000
      - ai: "网络重试下一步只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前仍在模型打印编辑页，或页面中央出现「网络连接超时」提示，并且底部显示蓝色「下一步」按钮，则再点击一次该「下一步」；如果已经出现「取消打印」按钮，或仍然存在「请确认耗材颜色」弹窗，则不要操作"
      - ai: "网络重试耗材确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果网络重试后再次弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "模型处理进度完成或可取消处理，页面出现可点击的「取消打印」或「取消处理」按钮，或出现「处理完成后直接打印」按钮"
        timeout: 240000
      - ai: "取消清理只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果出现「确认要取消任务吗」弹窗，点击「确定」；否则如果页面有「取消打印」或「取消处理」按钮，点击该取消按钮；如果页面已显示「已取消模型处理」、底部有「重新编辑」或「返回」按钮，则不要操作"
      - ai: "取消确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果仍在模型打印预览页并看到「取消打印」，再次点击「取消打印」；如果出现确认取消、确定或确认弹窗，点击确认按钮；如果页面已显示「已取消模型处理」或已经离开模型打印预览页则不要操作"
      - aiWaitFor: "已离开模型打印预览确认页，或底部不再同时显示「取消打印」和「确认打印」按钮，或页面显示「已取消模型处理」"
        timeout: 60000
      - ai: "取消后回首页只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果页面显示「已取消模型处理」且有「返回」按钮或左上角返回箭头，则点击返回回到 App 首页；如果仍有确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页或没有返回入口，则不要操作。不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - ai: "取消后二次回首页只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是「模型打印编辑」或模型导入后的编辑页，点击左上角返回箭头或页面「返回」按钮退出到 App 首页；如果出现放弃编辑、确认退出或确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」「重新编辑」。"
      - ai: "取消后三次回首页只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是模型详情页、模型部件选择页，或页面底部显示「去打印」但不是 App 首页，则点击左上角返回箭头或页面「返回」按钮离开该模型详情；如果已经在 App 首页则不要操作。不要点击「去打印」「下一步」「确认打印」「重新编辑」。"
      - aiWaitFor: "收尾首页确认：App 首页已加载完成且能看到「模型导入」等首页功能入口，或当前页面已离开模型打印预览且不再显示「已取消模型处理」「取消打印」「确认打印」「重新编辑」"
        timeout: 60000
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
