android:

tasks:
  - name: 模型生成记录
    # baseline.case_id: COM_KFB_MODEL_a341e0b47085
    # baseline.goal: 验证模型生成记录
    # baseline.start_page: App 首页
    # baseline.path: 生成记录
    # baseline.expected: 模型生成记录相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - aiWaitFor: "App 首页已加载完成，底部中间蓝色 3D icon 可见"
        timeout: 60000
      - ai: "首页遗留任务入口只判断当前截图，最多点击一次：如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」；如果没有该横幅或入口，立即完成。不要滚动，不要进入其他页面。"
      - ai: "遗留任务取消只判断当前截图，最多点击一次：如果当前页面有「取消打印」或「取消处理」按钮，则点击该取消按钮；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果仍在首页或没有这些按钮，立即完成。不要滚动。"
      - ai: "遗留任务确认只判断当前截图，最多点击一次：如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果页面显示「已取消模型处理」、已经回到首页、或没有确认弹窗，立即完成。不要滚动。"
      - sleep: 1000
      - aiTap: "底部中间蓝色 3D icon"
      - sleep: 800
      - aiWaitFor: "建模功能页、弹窗或面板已打开：要么能看到「模型导入」「趣味印章」「文字建模」和底部/右下角「生成记录」入口；要么能看到「开始创作」「图片建模」「语音创作」等 AI 建模入口，并出现「查看生成记录」链接"
        timeout: 60000
      - aiTap: "「生成记录」或「查看生成记录」入口，不要点击「模型导入」「趣味印章」「文字建模」「开始创作」「图片建模」「语音创作」"
      - sleep: 800
      - aiWaitFor: "模型生成记录列表页已打开，能看到「生成记录」页面标题、记录列表或空状态"
        timeout: 60000
      - aiAssert: "当前页面是模型生成记录页面，且没有加载失败、网络错误或异常弹窗"
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
