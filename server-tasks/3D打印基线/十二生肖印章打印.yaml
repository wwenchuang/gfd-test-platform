android:

tasks:
  - name: 十二生肖印章打印
    # baseline.case_id: COM_KFB_MODEL_eae567b5f2ba
    # baseline.goal: 验证十二生肖印章打印
    # baseline.start_page: App 首页
    # baseline.path: 趣味印章 -> 十二生肖印章 -> 印章+印盒盖 -> 牛 -> 生成3D预览图 -> 去打印 -> 下一步 -> 返回
    # baseline.expected: 十二生肖印章打印相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - ai: "启动恢复只判断当前截图，最多点击一次：如果当前页面显示「模型打印预览」「已取消模型处理」「取消打印」「确认打印」或「重新编辑」，优先点击页面可见的「返回」按钮或左上角返回箭头回到 App 首页；如果出现确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页或没有返回入口，立即完成。不要滚动，不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - sleep: 800
      - ai: "启动二次恢复只判断当前截图，最多点击一次：如果当前页面是「模型打印编辑」或模型导入后的编辑页，点击左上角返回箭头或页面「返回」按钮回到 App 首页；如果出现放弃编辑、确认退出或确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」「重新编辑」。"
      - sleep: 800
      - aiWaitFor: "App 首页已加载完成，首页中部功能入口横向列表可见，包含 AI建模、模型导入或可继续横向滑动的入口"
        timeout: 60000
      - ai: "首页遗留任务入口只判断当前截图，最多点击一次：如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」；如果没有该横幅或入口，立即完成。不要滚动，不要进入其他页面。"
      - ai: "遗留任务取消只判断当前截图，最多点击一次：如果当前页面有「取消打印」或「取消处理」按钮，则点击该取消按钮；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果仍在首页或没有这些按钮，立即完成。不要滚动。"
      - ai: "遗留任务确认只判断当前截图，最多点击一次：如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果页面显示「已取消模型处理」、已经回到首页、或没有确认弹窗，立即完成。不要滚动。"
      - sleep: 1000
      - aiScroll: "首页中部建模功能横向 icon 列表区域，只在这个横向列表内滑动，不要滚动整个页面"
        scrollType: "singleAction"
        direction: "right"
        distance: 400
      - runAdbShell: "input swipe 950 1080 150 1080 500"
      - aiWaitFor: "首页中部功能入口横向列表中可见「趣味印章」入口"
        timeout: 30000
      - aiTap: "首页中部功能入口横向列表里的「趣味印章」卡片，不要点击底部导航中间的「AI建模」"
      - aiWaitFor: "趣味印章页面已打开，能看到「十二生肖印章」入口"
        timeout: 60000
      - aiTap: "十二生肖印章"
      - aiWaitFor: "十二生肖印章配置页已打开，能看到「印章」或生肖选项"
        timeout: 60000
      - aiTap: "印章"
      - aiWaitFor: "生肖选项中出现「牛」"
        timeout: 60000
      - aiTap: "牛"
      - aiScroll: "当前十二生肖印章配置页内容区域，不要滚动顶部栏或底部导航"
        scrollType: "singleAction"
        direction: "down"
        distance: 450
      - aiWaitFor: "当前配置页出现「姓名」输入框"
        timeout: 30000
      - aiInput: "姓名输入框"
        value: "UI自动化"
      - aiScroll: "当前十二生肖印章配置页内容区域，不要滚动顶部栏或底部导航"
        scrollType: "singleAction"
        direction: "down"
        distance: 350
      - aiWaitFor: "当前配置页出现「印章字体」标题或字体选项列表"
        timeout: 30000
      - aiTap: "印章字体列表中间的字体选项"
      - aiTap: "生成3D预览图"
      - aiWaitFor: "3D 预览生成完成，页面出现可点击的「去打印」按钮"
        timeout: 240000
      - aiTap: "去打印"
      - aiWaitFor: "当前 3D 预览或模型打印页面加载完成，页面不再显示「加载中」进度，且底部出现可点击的「去打印」或「下一步」按钮"
        timeout: 240000
      - aiTap: "底部蓝色「下一步」按钮"
      - aiWaitFor: "页面已进入模型处理或打印预览流程：要么出现「请确认耗材颜色」弹窗，要么页面出现可点击的「取消打印」或「取消处理」按钮，要么出现「处理完成后直接打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "如果当前页面弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "确认耗材后页面已继续：要么页面出现可点击的「取消打印」或「取消处理」按钮，要么页面出现「处理完成后直接打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "确认耗材后只判断当前截图，最多再点击一次：如果仍在模型打印编辑页且底部显示蓝色「下一步」按钮，则再点击一次该「下一步」；如果已经出现「取消打印」按钮，或仍然存在「请确认耗材颜色」弹窗，则不要操作"
      - ai: "如果当前页面再次弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "模型处理进度完成或可取消处理，页面出现可点击的「取消打印」或「取消处理」按钮，或出现「处理完成后直接打印」按钮"
        timeout: 240000
      - aiTap: "取消打印"
      - ai: "如果仍在模型打印预览页并看到「取消打印」，再次点击「取消打印」；如果出现确认取消、确定或确认弹窗，点击确认按钮；如果已经离开模型打印预览页则不要操作"
      - aiWaitFor: "已离开模型打印预览确认页，或底部不再同时显示「取消打印」和「确认打印」按钮"
        timeout: 60000
      - ai: "如果当前页面有返回按钮且不是 App 首页，点击返回回到模型详情页或 App 首页；如果已经在稳定页面则不要操作"
      - ai: "取消后回首页只判断当前截图，最多点击一次：如果页面显示「已取消模型处理」且有「返回」按钮或左上角返回箭头，则点击返回回到 App 首页；如果仍有确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页或没有返回入口，则不要操作。不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - ai: "取消后二次回首页只判断当前截图，最多点击一次：如果当前页面是「模型打印编辑」或模型导入后的编辑页，点击左上角返回箭头或页面「返回」按钮退出到 App 首页；如果出现放弃编辑、确认退出或确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」「重新编辑」。"
      - aiWaitFor: "收尾首页确认：App 首页已加载完成且能看到「模型导入」等首页功能入口，或当前页面已离开模型打印预览且不再显示「已取消模型处理」「取消打印」「确认打印」「重新编辑」"
        timeout: 60000
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
