android: {}
tasks:
- name: 打印记录查看
  # baseline.case_id: COM_KFB_MODEL_117ec9dccef4
  # baseline.path: 我的 → 打印记录 → 核对指定设备及记录
  flow:
  - launch: com.kfb.model
  - aiWaitFor: 首页底部导航「我的」可见，当前选中打印机的编号末段是9888E0094F2A
    timeout: 12000
  - aiWaitFor: 页面中可见且可点击的目标：底部导航「我的」
    timeout: 12000
  - aiTap: 底部导航「我的」
  - aiWaitFor: 我的页面展示「打印记录」入口
    timeout: 12000
  - aiAssert: 我的页面展示「打印记录」入口
  - aiWaitFor: 页面中可见且可点击的目标：「打印记录」文字入口
    timeout: 12000
  - aiTap: 「打印记录」文字入口
  - aiWaitFor: 独立的打印记录列表页标题可见
    timeout: 12000
  - aiAssert: 独立的打印记录列表页标题可见
  - aiAssert: 当前为打印记录列表，顶部设备编号末段严格等于9888E0094F2A，显示记录或明确空状态且无网络错误；其他打印机编号均不满足
