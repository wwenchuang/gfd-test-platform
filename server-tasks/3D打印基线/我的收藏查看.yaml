android: {}
tasks:
- name: 我的收藏查看
  # baseline.case_id: COM_KFB_MODEL_a22bf0c3aab6
  # baseline.path: 我的 → 收藏 → 主题专区 → 模型
  flow:
  - launch: com.kfb.model
  - aiWaitFor: 底部导航「我的」可见
    timeout: 12000
  - ai: 仅当当前首页同时显示标题「打印已取消」、模型「关节龙」和「去提交反馈」时，点击白色提示卡片正下方带 × 的圆形关闭按钮一次。没有该提示时保持页面不动。
  - aiWaitFor: 页面中可见且可点击的目标：底部导航「我的」
    timeout: 12000
  - aiTap: 底部导航「我的」
  - aiWaitFor: 当前页面同时显示「我的设备」「打印记录」和下方「收藏」标签
    timeout: 12000
  - aiAssert: 当前页面同时显示「我的设备」「打印记录」和下方「收藏」标签
  - aiWaitFor: 页面中可见且可点击的目标：个人页面内容区域上方的「收藏」标签
    timeout: 12000
  - aiTap: 个人页面内容区域上方的「收藏」标签
  - aiWaitFor: 收藏下方出现「模型」「主题专区」「广场」
    timeout: 12000
  - aiAssert: 收藏下方出现「模型」「主题专区」「广场」
  - aiWaitFor: 页面中可见且可点击的目标：收藏分类中的「主题专区」
    timeout: 12000
  - aiTap: 收藏分类中的「主题专区」
  - aiWaitFor: 「主题专区」选中，区域下方显示条目或空状态
    timeout: 12000
  - aiAssert: 「主题专区」选中，区域下方显示条目或空状态
  - aiWaitFor: 页面中可见且可点击的目标：收藏分类中的「模型」
    timeout: 12000
  - aiTap: 收藏分类中的「模型」
  - aiWaitFor: 「模型」分类高亮，出现模型卡片或明确空状态
    timeout: 12000
  - aiAssert: 「模型」分类高亮，出现模型卡片或明确空状态
  - aiAssert: 当前个人页面中「收藏」和「模型」均已选中，存在模型列表或空状态且无网络错误
