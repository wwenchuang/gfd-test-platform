android:

tasks:
  - name: "模型导入-本地导入"
    # baseline.case_id: COM_KFB_MODEL_6f389b0277e7
    # baseline.goal: 验证模型导入-本地导入
    # baseline.start_page: App 首页
    # baseline.path: 模型导入 -> 本地导入 -> 搜索按钮 （🔍） -> 下一步 -> 返回
    # baseline.expected: 模型导入-本地导入相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - ai: "启动恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面显示「模型打印预览」「已取消模型处理」「取消打印」「确认打印」或「重新编辑」，优先点击页面可见的「返回」按钮或左上角返回箭头回到 App 首页；如果出现确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页或没有返回入口，立即完成。不要滚动，不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - sleep: 800
      - ai: "启动二次恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是「模型打印编辑」或模型导入后的编辑页，点击左上角返回箭头或页面「返回」按钮回到 App 首页；如果出现放弃编辑、确认退出或确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」「重新编辑」。"
      - sleep: 800
      - ai: "启动三次恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是模型详情页、模型部件选择页，或页面底部显示「去打印」但不是 App 首页，则点击左上角返回箭头或页面「返回」按钮离开该模型详情；如果已经在 App 首页则不要操作。不要点击「去打印」「下一步」「确认打印」「重新编辑」。"
      - sleep: 800
      - aiWaitFor: "App 首页已加载完成，首页中部功能入口横向列表可见，包含 AI建模、模型导入或可继续横向滑动的入口"
        timeout: 60000
      - ai: "首页遗留任务入口只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」；如果没有该横幅或入口，立即完成。不要滚动，不要进入其他页面。"
      - ai: "遗留任务取消只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面有「取消打印」或「取消处理」按钮，则点击该取消按钮；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果仍在首页或没有这些按钮，立即完成。不要滚动。"
      - ai: "遗留任务确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果页面显示「已取消模型处理」、已经回到首页、或没有确认弹窗，立即完成。不要滚动。"
      - ai: "遗留任务返回首页只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面显示「已取消模型处理」、仍在「模型打印预览」或底部有「重新编辑」「返回」按钮，则点击页面可见的「返回」按钮或左上角返回箭头回到 App 首页；如果出现确认退出、确认取消、确定或确认弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - aiWaitFor: "App 首页已加载完成，首页中部功能入口横向列表可见，包含 AI建模、模型导入或可继续横向滑动的入口，且当前页面不显示「已取消模型处理」、模型打印预览或模型打印编辑页"
        timeout: 60000
      - sleep: 1000
      - aiTap: "首页中部功能入口横向列表里的「模型导入」卡片，不要点击底部导航中间的「AI建模」"
      - aiTap: "本地导入"
      - aiWaitFor: "系统文件选择器已打开，页面标题可能显示「下载内容」或本地导入相关标题，右上角放大镜搜索图标可见"
        timeout: 60000
      - aiTap: "右上角放大镜搜索图标"
      - aiWaitFor: "文件选择器顶部搜索输入框已出现并可输入"
        timeout: 30000
      - aiTap: "文件选择器顶部搜索输入框"
      - aiInput: "文件选择器顶部搜索输入框"
        value: ".stl"
        autoDismissKeyboard: false
        mode: "replace"
      - aiKeyboardPress: "文件选择器顶部搜索输入框"
        keyName: "Enter"
      - aiWaitFor: "搜索结果列表中已出现 .stl 文件，列表第一条可见文件名包含「.stl」"
        timeout: 60000
      - aiTap: "搜索结果列表第一条 .stl 文件的文件名文字区域，例如「轮子链接.stl」；点击文件名或文件图标附近，不点击右侧四角/更多图标"
      - aiWaitFor: "已选中 .stl 文件，页面底部出现可点击的「下一步」按钮"
        timeout: 60000
      - aiTap: "底部蓝色「下一步」按钮"
      - aiWaitFor: "模型打印编辑页已打开，页面显示 3D 模型预览、模型尺寸或支撑设置，底部可见「下一步」按钮"
        timeout: 120000
      - ai: "本地导入收尾只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前在模型打印编辑页、模型导入后的预览页或文件选择器返回后的导入页，则点击左上角返回箭头或页面「返回」按钮回到 App 首页；如果出现「放弃导入」「确认退出」弹窗，点击确认；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」。"
      - ai: "本地导入二次收尾只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前仍不在 App 首页且可见「返回」按钮或左上角返回箭头，则点击返回；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」。"
      - aiWaitFor: "App 首页已加载完成，首页中部功能入口横向列表可见，包含「模型导入」入口，且当前页面不显示模型打印编辑页、模型打印预览或文件选择器"
        timeout: 60000
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
