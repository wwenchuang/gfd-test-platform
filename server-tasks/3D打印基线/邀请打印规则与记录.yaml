android: {}
tasks:
- name: 邀请打印规则与记录
  # baseline.case_id: COM_KFB_MODEL_390d73ebf60d
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航最右侧的「我的」
  - aiTap: 个人页「邀请打印」
  - aiWaitFor: 邀请打印页展示邀请流程、奖品与任务、活动规则
    timeout: 12000
  - aiTap: 右上角「邀请记录」
  - aiWaitFor: 邀请记录页显示「邀请记录」标题，并有邀请明细或明确的无记录提示
    timeout: 12000
  - aiAssert: 邀请记录页显示「邀请记录」标题，并有邀请明细或明确的无记录提示
