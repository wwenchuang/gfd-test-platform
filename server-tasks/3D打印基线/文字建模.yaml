android: {}

tasks:
  - name: 文字建模
    # baseline.case_id: COM_KFB_MODEL_4f9e47eb53d2
    # baseline.goal: 验证文字建模
    # baseline.start_page: App 首页
    # baseline.path: 首页 → 创作 → 开始创作 → 文字描述 → 生成模型 → 去打印 → 切片预览 → 返回
    # baseline.expected: 本次硬币描述生成模型，编辑器可继续到切片结果，退出本次待确认预览。
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      # 清理本应用的页面栈；保留进程中的设备连接。
      - runAdbShell: am start -W -f 0x10008000 -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.kfb.model/.splash.SplashActivity
      - launch: com.kfb.model
      - aiWaitFor: 底部导航可见「创作」和「我的」，最左侧可见房子图标
        timeout: 12000
      - aiTap: 底部导航最右侧的「我的」
      - aiWaitFor: 个人页中可见「我的设备」和「打印记录」
        timeout: 12000
      - aiTap: 底部导航最左侧的房子图标
      - aiWaitFor: 首页的 EP3-9888E0094F2A 设备卡片已刷新，明确显示「空闲」，或已显示打印中、任务待处理等占用状态
        timeout: 35000
      - aiAssert: 该设备栏显示空闲，首页没有正在打印、模型处理中或模型处理完成待打印的任务横幅。
      - aiTap: 底部导航中间的「创作」
      - aiWaitFor: 创作页显示「AI创作」、「说出想法，开始创造」及「开始创作」
        timeout: 12000
      - aiTap: 「说出想法，开始创造」右侧的「开始创作」
      - aiWaitFor: 创作会话出现描述输入框或开启新对话的入口
        timeout: 12000
      - ai: 若已显示可输入描述的空白会话则结束本步骤；若显示已有消息或新对话入口且没有空白会话，则仅点「新对话」一次。
      - aiWaitFor: 当前是空白创作会话，描述输入框可输入，当前会话没有历史生成结果
        timeout: 12000
      - aiInput: 会话底部的模型描述输入框
        value: UI自动化硬币图片
        mode: replace
      - aiTap: 该输入框右侧的发送按钮
      - aiWaitFor: 当前创作会话中已发送「UI自动化硬币图片」。助手的本次回复含参考图和「没有喜欢的」入口，或回复卡片底部已显示「不补充 直接生成」「立即生成」其中一个按钮。
        timeout: 240000
      - ai: 若本次硬币回复卡片已经显示「不补充 直接生成」或「立即生成」，立即结束本步骤。若出现本次参考图和「没有喜欢的」入口，则仅点该入口一次并结束本步骤。
      - aiWaitFor: 本次硬币需求的助手回复卡片内显示「主体」「细节」「用途」，三个标签下方长按钮的文字为「不补充 直接生成」或「立即生成」。
        timeout: 30000
      - aiTap: 本次硬币需求的助手回复卡片中，位于「主体」「细节」「用途」三个标签正下方、文字为「不补充 直接生成」或「立即生成」的那个长按钮
      - aiWaitFor: 本次硬币设计图已经渲染，设计图下方的「就这样，生成模型」按钮已出现
        timeout: 240000
      - aiTap: 当前硬币设计图下方的「就这样，生成模型」按钮
      - aiWaitFor: 本次对话的硬币三维模型已生成，模型卡片上「去打印」可点击
        timeout: 240000
      - aiTap: 本次硬币模型卡片上的「去打印」
      - aiWaitFor: 当前模型的三维摆放编辑画布已加载，有模型尺寸及底部「下一步」
        timeout: 120000
      - aiAssert: 当前编辑画布中已加载本次生成的硬币模型，模型尺寸可见。
      - aiTap: 当前模型摆放编辑页底部的「下一步」
      - aiWaitFor: 本次摆放编辑器上有「请确认耗材颜色」弹窗及并排的「修改设置」「确认」，或页面顶部标题已经变成「模型打印预览」
        timeout: 30000
      - runAdbShell: >-
          file=$(mktemp /data/local/tmp/qa-kfb-preview.XXXXXX) || exit 1;
          trap 'rm -f "$file"' EXIT;
          for attempt in 1 2 3; do
          : > "$file"; uiautomator dump "$file" >/dev/null && [ -s "$file" ] || exit 1;
          if grep -Fq 'text="请确认当前使用的耗材颜色为：' "$file" && grep -Fq 'text="修改设置"' "$file"; then
          bounds=$(tr '>' '\n' < "$file" | grep -F 'text="确认"' | grep -F 'class="android.widget.Button"' | grep -F 'package="com.kfb.model"' | grep -F ' clickable="true"' | grep -F ' enabled="true"' | sed -n 's/.*bounds="\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]\[\([0-9][0-9]*\),\([0-9][0-9]*\)\]".*/\1 \2 \3 \4/p');
          set -- $bounds; [ "$#" -eq 4 ] || exit 1;
          input tap "$((($1+$3)/2))" "$((($2+$4)/2))"; exit $?; fi;
          if tr '>' '\n' < "$file" | grep -F 'text="模型打印预览"' | grep -F 'resource-id="com.kfb.model:id/web_title_tv_middle"' > /dev/null; then exit 0; fi;
          done; exit 1
      - aiWaitFor: 「模型打印预览」的结果卡片同时显示「预计时间」下的具体时长和「模型耗材」下带 g 的数值，底部同一行左侧按钮为「取消打印」、右侧按钮为「确认打印」。
        timeout: 240000
      - aiAssert: 当前是本次编辑后连续打开的待确认预览，有预计时间、耗材及「确认打印」按钮，尚未发送打印。页面没有正在打印的进度，也没有其他任务或设备的详情。
      - aiTap: 该待确认模型打印预览页底部、与「确认打印」并列的「取消打印」
      - aiWaitFor: 本次预览中央弹窗标题「确认要取消任务吗？」及「确定」同时可见，或页面已显示「已取消模型处理」和底部「返回」
        timeout: 12000
      - aiTap: 弹窗「确认要取消任务吗？」内右侧的「确定」按钮；若中央已显示「已取消模型处理」，仅轻触中央静态提示「已取消模型处理」文字。
      - aiWaitFor: 「模型打印预览」显示「已取消模型处理」和底部「返回」按钮
        timeout: 30000
      - aiTap: 已取消模型处理页面底部的「返回」
      - aiWaitFor: 模型摆放编辑器的左侧「居中」和「旋转」工具、底部「下一步」按钮已出现
        timeout: 12000
      - aiAssert: 当前画布有本次生成的三维模型，左侧有「居中」和「旋转」，底部有「下一步」。这些控件同时出现表示已离开任务结果页并返回模型编辑器。
