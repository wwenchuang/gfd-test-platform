android: {}

tasks:
  - name: 文字建模
    # baseline.case_id: COM_KFB_MODEL_4f9e47eb53d2
    # baseline.goal: 验证文字建模
    # baseline.start_page: App 首页
    # baseline.path: 首页 → 创作 → 开始创作 → 文字描述 → 生成模型 → 去打印 → 切片预览 → 返回
    # baseline.expected: 本次硬币描述生成模型，编辑器可继续到切片结果，退出本次待确认预览。
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: am force-stop com.kfb.model
      - launch: com.kfb.model
      - aiWaitFor: 智小白3D底部导航中有「首页」「创作」「我的」
        timeout: 12000
      - aiTap: 底部导航的「首页」
      - aiWaitFor: 首页顶部设备栏显示 EP3-9888E0094F2A，快捷入口「标牌」和「导入打印」可见
        timeout: 12000
      - aiAssert: 该设备栏显示空闲，首页没有正在打印、模型处理中或模型处理完成待打印的任务横幅。
      - aiTap: 底部导航中间的「创作」
      - aiWaitFor: 创作页显示「AI创作」、「说出想法，开始创造」及「开始创作」
        timeout: 12000
      - aiTap: 「说出想法，开始创造」右侧的「开始创作」
      - aiWaitFor: 创作会话出现描述输入框或开启新对话的入口
        timeout: 12000
      - ai: 若已显示可输入描述的空白会话则结束本步骤；若显示已有消息或新对话入口且没有空白会话，则仅点「新对话」一次。
      - aiWaitFor: 当前是空白创作会话，描述输入框可输入，当前会话没有历史生成结果
        timeout: 12000
      - aiInput: 会话底部的模型描述输入框
        value: UI自动化硬币图片
        mode: replace
      - aiTap: 该输入框右侧的发送按钮
      - aiWaitFor: 当前创作会话中已发送「UI自动化硬币图片」，并已返回本次参考图和「没有喜欢的」入口，或本次描述下已有直接生成模型的选项
        timeout: 240000
      - ai: 如果本次参考图下显示「没有喜欢的」，仅点该入口一次；若当前已有「不补充 直接生成」或「生成模型」按钮则结束本步骤。
      - aiWaitFor: 当前硬币创作会话出现「不补充 直接生成」或「生成模型」按钮
        timeout: 12000
      - ai: 点击当前硬币创作会话的「不补充 直接生成」；若只有「生成模型」，点击「生成模型」。只触发一次生成。
      - aiWaitFor: 本次对话的硬币三维模型已生成，模型卡片上「去打印」可点击
        timeout: 240000
      - aiTap: 本次硬币模型卡片上的「去打印」
      - aiWaitFor: 当前模型的三维摆放编辑画布已加载，有模型尺寸及底部「下一步」
        timeout: 120000
      - aiAssert: 当前编辑画布中已加载本次生成的硬币模型，模型尺寸可见。
      - aiTap: 当前模型摆放编辑页底部的「下一步」
      - aiWaitFor: 页面出现「请确认耗材颜色」弹窗，或切换至标题为「模型打印预览」的页面
        timeout: 30000
      - ai: 仅当当前弹窗标题为「请确认耗材颜色」时，点击此弹窗的「确认」一次。若当前为「模型打印预览」则直接结束本步骤。
      - aiWaitFor: 当前「模型打印预览」显示已完成切片的预计时间和模型耗材，底部同时有「取消打印」和「确认打印」
        timeout: 240000
      - aiAssert: 当前是本次编辑后连续打开的待确认预览，有预计时间、耗材及「确认打印」按钮，尚未发送打印。页面没有正在打印的进度，也没有其他任务或设备的详情。
      - aiTap: 该待确认模型打印预览页底部、与「确认打印」并列的「取消打印」
      - aiWaitFor: 预览上弹出确认取消任务的询问，或预览已明确显示「已取消模型处理」
        timeout: 12000
      - ai: 仅当预览上显示询问是否取消本次任务的弹窗时，点弹窗「确定」一次；若已显示「已取消模型处理」则结束本步骤。
      - aiWaitFor: 「模型打印预览」显示「已取消模型处理」和底部「返回」按钮
        timeout: 30000
      - aiTap: 已取消模型处理页面底部的「返回」
      - aiAssert: 已离开已取消模型处理的预览页，返回本次创作、编辑、导入或首页。
