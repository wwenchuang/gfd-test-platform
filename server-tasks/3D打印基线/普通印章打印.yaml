android: {}
tasks:
- name: 普通印章打印
  # baseline.case_id: COM_KFB_MODEL_9d60338c7365
  # baseline.goal: 制作文字印章
  # baseline.start_page: App 首页
  # baseline.path: 单章DIY → 输入文字及选择字体 → 试盖 → 选择把手 → 完成作品
  # baseline.expected: 单章DIY 完成页显示本次文字印章的三维预览与已保存的作品名称
  # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 底部导航可见「创作」和「我的」，最左侧可见房子图标
    timeout: 12000
  - aiTap: 底部导航最左侧的房子图标
  - aiTap: 首页快捷功能中的「印章」
  - aiWaitFor: 印章页可见「单章DIY」卡片与「立即定制」按钮
    timeout: 12000
  - aiTap: 「单章DIY」卡片中的「立即定制」
  - aiWaitFor: 单章DIY 的设计印面页显示「图案」「文字」「手绘上传」
    timeout: 12000
  - aiTap: 设计印面页的「文字」标签
  - aiWaitFor: 「输入文字」下方出现占位文案为「请输入1～6个字」的文本框，并显示「选择字体」
    timeout: 12000
  - aiInput: 「输入文字」下的1～6字输入框
    value: UI自动化
    mode: replace
  - aiWaitFor: 文字输入框显示「UI自动化」
    timeout: 12000
  - aiQuery: 平台软键盘收起v1：dismissKeyboard
  - aiWaitFor: 「选择字体」下显示以「智小白」预览的字体样式
    timeout: 12000
  - aiTap: 「选择字体」下方从左数第二个「智小白」字体样式
  - aiWaitFor: 第二个字体样式显示蓝色选中边框
    timeout: 12000
  - aiWaitFor: 印面设计页的「下一步：盖印效果」按钮可用
    timeout: 12000
  - aiTap: 印面设计页底部「下一步：盖印效果」
  - aiWaitFor: 「盖印效果」页显示图案有色、背景有色及图案尺寸
    timeout: 12000
  - aiTap: 「选择图案尺寸」区域的 40mm 标准尺寸
  - aiAssert: 40mm 标准尺寸带选中边框
  - aiTap: 盖印效果页底部「下一步：试盖效果」
  - aiWaitFor: 试盖效果页显示可盖印的纸张区域和「选择印泥颜色」
    timeout: 12000
  - aiTap: 试盖效果页中提示点击盖印的纸张区域
  - aiAssert: 纸张区域已出现文字的盖印图样
  - aiTap: 试盖效果页底部「下一步：选择把手」
  - aiWaitFor: 选择把手步骤已显示
    timeout: 12000
  - aiTap: 选择把手页「巧克力球」样式
  - aiWaitFor: 「巧克力球」把手样式已选中
    timeout: 12000
  - aiTap: 选择把手页底部「下一步：完成」
  - aiWaitFor: 「制作完成」及「你的印章已生成」出现，显示作品名称、已自动保存至生成记录和「去打印」
    timeout: 240000
  - aiAssert: 单章DIY 完成页显示本次文字印章的三维预览与已保存的作品名称
