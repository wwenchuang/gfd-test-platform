android:

tasks:
  - name: OBJ保龄球打印
    # baseline.case_id: COM_KFB_MODEL_391142ea35f9
    # baseline.goal: 验证OBJ保龄球打印
    # baseline.start_page: App 首页
    # baseline.path: 首页搜索保龄球套装 -> 迷你保龄球套装 -> 查看全部 -> 保龄球 -> 去打印 -> 下一步 -> 返回
    # baseline.expected: OBJ保龄球打印相关页面结果符合预期
    # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
    flow:
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1500
      - launch: com.kfb.model
      - ai: "启动恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面显示「模型打印预览」「已取消模型处理」「取消打印」「确认打印」或「重新编辑」，优先点击页面可见的「返回」按钮或左上角返回箭头回到 App 首页；如果出现确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页或没有返回入口，立即完成。不要滚动，不要点击「重新编辑」「确认打印」「去打印」「下一步」。"
      - sleep: 800
      - ai: "启动二次恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是「模型打印编辑」或模型导入后的编辑页，点击左上角返回箭头或页面「返回」按钮回到 App 首页；如果出现放弃编辑、确认退出或确认取消弹窗，点击「确定」或「确认」；如果已经在 App 首页则不要操作。不要点击「下一步」「去打印」「确认打印」「重新编辑」。"
      - sleep: 800
      - ai: "启动三次恢复只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面是模型详情页、模型部件选择页，或页面底部显示「去打印」但不是 App 首页，则点击左上角返回箭头或页面「返回」按钮离开该模型详情；如果已经在 App 首页则不要操作。不要点击「去打印」「下一步」「确认打印」「重新编辑」。"
      - sleep: 800
      - aiWaitFor: "App 首页已加载完成，右上角搜索入口或底部导航可见"
        timeout: 60000
      - ai: "首页遗留任务入口只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前首页顶部出现「模型处理完成」横幅，或横幅右侧出现「去打印」入口，则点击「去打印」；如果没有该横幅或入口，立即完成。不要滚动，不要进入其他页面。"
      - ai: "遗留任务取消只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面有「取消打印」或「取消处理」按钮，则点击该取消按钮；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果仍在首页或没有这些按钮，立即完成。不要滚动。"
      - ai: "遗留任务确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果出现「确认要取消任务吗」或确认取消弹窗，则点击「确定」或「确认」；如果页面显示「已取消模型处理」、已经回到首页、或没有确认弹窗，立即完成。不要滚动。"
      - sleep: 1000
      - aiTap: "右上角放大镜搜索图标或搜索入口"
      - aiInput: "当前页面的搜索输入框或文本输入框"
        value: "保龄球"
      - aiKeyboardPress: "当前页面的搜索输入框或文本输入框"
        keyName: "Enter"
      - aiWaitFor: "搜索结果中出现「迷你保龄球套装」"
        timeout: 60000
      - aiTap: "迷你保龄球套装"
      - aiWaitFor: "套装详情或推荐列表页面已打开，能看到「查看全部」"
        timeout: 60000
      - aiTap: "查看全部"
      - aiWaitFor: "完整列表中出现「保龄球」模型"
        timeout: 60000
      - aiTap: "保龄球"
      - aiWaitFor: "保龄球模型详情页已打开，页面中央不再显示「加载中」或加载百分比遮罩，3D 模型预览加载完成，页面底部出现可点击的「去打印」按钮"
        timeout: 180000
      - aiTap: "去打印"
      - aiWaitFor: "当前 3D 预览或模型打印编辑页面加载完成，页面不再显示「加载中」进度，且底部出现可点击的「去打印」或「下一步」按钮"
        timeout: 240000
      - ai: "只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果底部蓝色主按钮文字是「去打印」，点击该「去打印」；如果底部主按钮已经是「下一步」，不要点击并立即完成；如果出现「请确认耗材颜色」弹窗或「取消打印」按钮，也不要操作。不要重复点击，不要等待页面变化。"
      - ai: "耗材确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果页面出现「请确认耗材颜色」弹窗，则点击蓝色「确认」按钮（弹窗右下角）；如果没有弹窗则不要操作"
      - aiWaitFor: "模型打印编辑页加载完成，页面不再显示「加载中」进度，底部「下一步」按钮已变为蓝色可点击状态"
        timeout: 120000
      - aiTap: "底部蓝色「下一步」按钮"
      - aiWaitFor: "页面已进入模型处理或打印预览流程：要么出现「请确认耗材颜色」弹窗，要么页面出现可点击的「取消打印」或「取消处理」按钮，要么出现「处理完成后直接打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "耗材确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "确认耗材后页面已继续：要么页面出现可点击的「取消打印」或「取消处理」按钮，要么页面出现「处理完成后直接打印」按钮，要么仍在模型打印编辑页且底部「下一步」按钮为蓝色可点击状态"
        timeout: 120000
      - ai: "确认耗材后只判断当前截图，最多再点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果仍在模型打印编辑页且底部显示蓝色「下一步」按钮，则再点击一次该「下一步」；如果已经出现「取消打印」按钮，或仍然存在「请确认耗材颜色」弹窗，则不要操作"
      - ai: "耗材二次确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果当前页面再次弹出「请确认耗材颜色」弹窗，只点击弹窗右下角蓝色「确认」按钮一次；如果没有该弹窗或已经出现「取消打印」按钮，则不要操作"
      - aiWaitFor: "模型处理进度完成或可取消处理，页面出现可点击的「取消打印」或「取消处理」按钮，或出现「处理完成后直接打印」按钮"
        timeout: 240000
      - ai: "取消清理只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果出现「确认要取消任务吗」弹窗，点击「确定」；否则如果页面有「取消打印」或「取消处理」按钮，点击该取消按钮；如果页面已显示「已取消模型处理」、底部有「重新编辑」或「返回」按钮，则不要操作"
      - ai: "取消确认只判断当前截图，最多点击一次：如果执行了点击，点击后必须立即完成，不要继续判断点击后的新页面，不要继续规划第二步；如果出现确认取消、确定或确认弹窗，点击确认按钮；如果页面仍有「取消打印」或「取消处理」按钮，点击该取消按钮；如果已经离开模型打印预览页或页面已显示「已取消模型处理」，则不要操作"
      - aiWaitFor: "已离开模型打印预览确认页，或底部不再同时显示「取消打印」和「确认打印」按钮"
        timeout: 60000
      - runAdbShell: "am force-stop com.kfb.model"
      - sleep: 1000
