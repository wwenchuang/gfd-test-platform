android: {}
tasks:
- name: OBJ保龄球打印
  # baseline.case_id: COM_KFB_MODEL_391142ea35f9
  # baseline.goal: 验证OBJ保龄球打印
  # baseline.start_page: App 首页
  # baseline.path: 首页搜索保龄球 → 迷你保龄球套装 → 查看全部 → 保龄球部件 → 打印编辑 → 球体打印预览及取消返回
  # baseline.expected: 目标模型进入打印预览，完成切片，取消本次模型处理并返回。
  # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 底部导航可见「创作」和「我的」，最左侧可见房子图标
    timeout: 12000
  - aiTap: 底部导航最左侧的房子图标
  - aiWaitFor: 首页顶部显示当前打印机的设备卡片，快捷入口中同时可见「印章」和「导入打印」
    timeout: 12000
  - aiAssert: 首页选中 EP3-9888E0094F2A，状态为「空闲」，没有待处理、待打印或模型处理完成的任务横幅
  - aiTap: 首页顶端的放大镜搜索图标
  - aiWaitFor: 顶部有搜索输入框
    timeout: 12000
  - aiInput: 顶部搜索输入框
    value: 保龄球
    mode: replace
  - aiWaitFor: 搜索框内显示「保龄球」，右侧「搜索」按钮可用
    timeout: 12000
  - aiTap: 搜索框右侧的「搜索」按钮
  - aiWaitFor: 模型搜索结果列表中出现标题完整为「迷你保龄球套装」的卡片
    timeout: 12000
  - aiTap: 搜索结果标题完整为「迷你保龄球套装」的模型卡片
  - aiWaitFor: 「迷你保龄球套装」详情显示模型部件区域及「查看全部」
    timeout: 12000
  - aiTap: 套装部件区域内的「查看全部」
  - aiWaitFor: 全部部件中有名称完整为「保龄球」的部件
    timeout: 12000
  - aiTap: 名称完整为「保龄球」的球体部件
  - aiWaitFor: 保龄球模型预览的加载遮罩已消失，底部「去打印」或模型打印编辑页「下一步」可用
    timeout: 120000
  - aiWaitFor: 当前选中的模型部件是保龄球球体，预览中未选中球瓶或整套模型
    timeout: 12000
  - ai: 只判断当前截图：若本次模型预览底部「去打印」可用，只点该按钮一次并结束；若已进入有「下一步」的模型打印编辑页，直接结束。
  - aiWaitFor: 球体模型的构建板和「下一步」按钮已出现，或弹出「请确认耗材颜色」
    timeout: 120000
  - ai: 若出现「请确认耗材颜色」弹窗，只点击该弹窗内的「确认」一次并结束；若已显示模型打印编辑页则直接结束。
  - aiWaitFor: 模型打印编辑页已显示构建板中的模型，加载遮罩消失，底部「下一步」为可点击状态
    timeout: 120000
  - aiTap: 模型打印编辑页底部蓝色「下一步」按钮
  - aiWaitFor: 出现「请确认耗材颜色」弹窗或已进入「模型打印预览」页
    timeout: 12000
  - ai: 仅当标题为「请确认耗材颜色」的弹窗可见时，点击该弹窗内的「确认」一次并结束；若已进入模型打印预览页则直接结束。
  - aiWaitFor: 「请确认耗材颜色」弹窗已关闭，页面为模型打印预览，或仍在显示当前模型和可用「下一步」按钮的编辑页
    timeout: 12000
  - ai: 仅在确认耗材后返回本次模型打印编辑页且「下一步」可用时，点击「下一步」一次；已进入预览或处理中时直接结束。
  - aiWaitFor: 标题为「模型打印预览」，或出现「请确认耗材颜色」弹窗
    timeout: 30000
  - ai: 若再次弹出「请确认耗材颜色」，仅点击该弹窗的「确认」一次；已进入预览时直接结束。
  - aiWaitFor: 模型打印预览页显示处理完成的保龄球球体，能看到模型几何预览及「确认打印」按钮
    timeout: 240000
  - aiAssert: 当前是本次保龄球球体的模型打印预览，同时显示「取消打印」和「确认打印」按钮。页面未进入设备工作或打印队列。
  - aiTap: 模型打印预览底部的「取消打印」按钮
  - aiWaitFor: 出现取消本次模型处理的确认弹窗，或模型打印预览页已显示「已取消模型处理」
    timeout: 12000
  - ai: 只在当前取消模型处理的二次确认弹窗内点击肯定取消任务的「确定」或「确认」一次并结束；若已显示「已取消模型处理」，直接结束。
  - aiWaitFor: 模型打印预览显示「已取消模型处理」，下方有「返回」按钮
    timeout: 12000
  - aiTap: 已取消模型处理页面的「返回」按钮
  - aiWaitFor: 返回后出现首页底部导航，或回到有模型标题的详情页、编辑页或印章配置页
    timeout: 12000
  - aiAssert: 已离开模型打印预览页，出现首页导航、原模型详情或编辑配置控件
