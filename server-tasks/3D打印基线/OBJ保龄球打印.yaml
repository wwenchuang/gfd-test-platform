android: {}
tasks:
- name: OBJ保龄球打印
  # baseline.case_id: COM_KFB_MODEL_391142ea35f9
  # baseline.goal: OBJ 单球文件预览
  # baseline.start_page: App 首页
  # baseline.path: 首页搜索保龄球 → 迷你保龄球套装 → 查看全部 → 选择 22 mm 单球 → 组件预览
  # baseline.expected: 当前模型是单个保龄球球体，构建板中没有球瓶。若处在「确认组件」，仅有一个球体组件且已选中。
  # baseline.repair_hint: 优先参考当前 App 的页面知识库和基线辅助截图；如果入口文案变化，使用真实可见文案修复步骤和断言。
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 底部导航可见「创作」和「我的」，最左侧可见房子图标
    timeout: 12000
  - aiTap: 底部导航最左侧的房子图标
  - aiTap: 首页顶端的放大镜搜索图标
  - aiWaitFor: 顶部有搜索输入框
    timeout: 12000
  - aiInput: 顶部搜索输入框
    value: 保龄球
    mode: replace
  - aiWaitFor: 搜索框内显示「保龄球」，右侧「搜索」按钮可用
    timeout: 12000
  - aiTap: 搜索框右侧的「搜索」按钮
  - aiWaitFor: 模型搜索结果列表中出现标题完整为「迷你保龄球套装」的卡片
    timeout: 12000
  - aiTap: 搜索结果标题完整为「迷你保龄球套装」的模型卡片
  - aiWaitFor: 「迷你保龄球套装」详情显示模型部件区域及「查看全部」
    timeout: 12000
  - aiTap: 套装部件区域内的「查看全部」
  - aiWaitFor: 「模型文件」列表中有一行标题完整为「保龄球套装2」，缩略图是单个带指孔的球，X、Y、Z 均为 22 mm
    timeout: 12000
  - aiTap: 标题完整为「保龄球套装2」、三轴各 22 mm 的单球文件行
  - aiWaitFor: 模型加载完成，构建板中只显示单个球体，底部显示「确认组件」步骤的「确认」、模型入口「去打印」或打印设置页的「下一步」
    timeout: 120000
  - aiAssert: 当前模型是单个保龄球球体，构建板中没有球瓶。若处在「确认组件」，仅有一个球体组件且已选中。
