android: {}
tasks:
- name: 成长乐园教材分科
  # baseline.case_id: COM_KFB_MODEL_030aa062e2a3
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 智小白3D底部导航的「创作」和最左侧的首页房子图标可见
    timeout: 12000
  - aiTap: 底部导航的「成长」
  - aiWaitFor: 成长乐园有教材同步学、建模大冒险、科创乐园三个课程入口
    timeout: 12000
  - aiTap: 成长乐园「教材同步学」卡片上的「进入课程」
  - sleep: 1500
  - ai: 检查屏幕正中是否有标题为「体验提示」的弹窗。如果有，点击弹窗内「我知道了」一次。如果没有弹窗，保持当前页面且不点击任何控件，结束本步。
  - aiWaitFor: 教材同步学课程列表有「数学」「语文」「英语」学科标签
    timeout: 12000
  - aiTap: 课程页底部「英语」学科标签
  - aiWaitFor: 教材同步学的「英语」学科处于选中态，列表中至少有一张英语学习卡片，例如「认识字母」或「动物单词」
    timeout: 12000
  - aiAssert: 教材同步学的「英语」学科处于选中态，列表中至少有一张英语学习卡片，例如「认识字母」或「动物单词」
