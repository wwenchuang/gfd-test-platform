android: {}
tasks:
- name: 客服对话
  # baseline.case_id: COM_KFB_MODEL_bf612450b118
  # baseline.path: 我的 → 服务中心 → 联系客服 → 验证会话输入与发送控件
  flow:
  - runAdbShell: am force-stop com.kfb.model
  - launch: com.kfb.model
  - aiWaitFor: 底部导航栏右侧可见「我的」
    timeout: 12000
  - aiTap: 底部导航栏的「我的」
  - aiWaitFor: 当前为个人页，显示「我的设备」和「打印记录」
    timeout: 12000
  - aiTap: 个人页左上角「服务中心」
  - aiWaitFor: 服务中心页面底部可见「联系客服」
    timeout: 12000
  - aiTap: 服务中心底部「联系客服」
  - aiWaitFor: 客服会话已打开，底部有输入消息的编辑框
    timeout: 20000
  - aiTap: 底部会话消息输入框
  - aiInput: 当前客服会话的消息输入框
    value: QA
  - aiAssert: 底部输入框包含尚未发送的「QA」，同一输入栏的「发送」控件可见且可用
  - aiTap: 仅点击含草稿「QA」的文本输入框内部以恢复输入焦点
  - runAdbShell: input keyevent 123 67 67
  - aiWaitFor: 底部输入框重新显示「输入消息」占位提示
    timeout: 12000
  - aiAssert: 底部输入框已清空，重新显示「输入消息」占位提示，此次草稿未产生外发气泡
